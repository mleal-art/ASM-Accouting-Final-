    <style>
:root {
    --primary: #14213D;
    --primary-light: #1E3A63;
    --primary-dark: #0B1526;
    --blue: #2563EB;
    --blue-light: #3B82F6;
    --accent: #A88841;
    --success: #0F9D6E;
    --success-bg: #E3F7EF;
    --danger: #DC2626;
    --danger-bg: #FDECEC;
    --warn: #B45309;
    --warn-bg: #FEF3E2;
    --bg: #F4F6FA;
    --card: #FFFFFF;
    --border: #E4E9F0;
    --text: #1B2431;
    --muted: #6B7A90;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Figtree', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 96px;
    -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: 'Bricolage Grotesque', sans-serif; color: var(--primary); }

/* HEADER */
header {
    background: linear-gradient(120deg, var(--primary-dark) 0%, var(--primary) 55%, var(--primary-light) 100%);
    color: white;
    padding: 18px 20px;
    border-bottom: 3px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 12px rgba(11,21,38,0.25);
}
.header-wrap { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.logo-svg { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-svg img { width: 100%; height: 100%; object-fit: contain; }
header h1 { font-family:'Bricolage Grotesque',-apple-system,'Segoe UI',sans-serif; font-size: 1.15rem; margin: 0; line-height: 1.1; color: white; letter-spacing: 0.3px; }
header p { margin: 3px 0 0 0; font-size: 0.62rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 1.8px; color: #C9D6EC; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: white;
    width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }

main { max-width: 960px; margin: 0 auto; padding: 16px; }

/* DASHBOARD */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.dash-card {
    background: var(--card); padding: 16px; border-radius: 18px;
    box-shadow: 0 2px 10px rgba(20,33,61,0.06); border: 1px solid var(--border);
}
.dash-card label { display: block; font-size: 0.62rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.dash-card .val { font-size: 1.35rem; font-weight: 700; font-family:'Bricolage Grotesque',-apple-system,'Segoe UI',sans-serif; color: var(--primary); }
.dash-card.highlight { border-top: 4px solid var(--accent); }
.dash-card.blue { border-top: 4px solid var(--blue); }

.section-title { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 12px; }
.section-title h2 { margin: 0; font-size: 1.05rem; }
.section-title h3 { margin: 0; font-size: 0.95rem; }

/* CARDS */
.card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(20,33,61,0.05); }
.card.tight { padding: 14px 16px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0F3F8; cursor: pointer; gap: 10px; }
.row:last-child { border-bottom: none; }
.row.static { cursor: default; }
.row-info small { color: var(--muted); }

/* TABS */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; }
.tab-btn {
    flex-shrink: 0; background: white; border: 1px solid var(--border); color: var(--muted);
    padding: 9px 16px; border-radius: 30px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;
}
.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

/* SEARCH / FILTER */
.search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
.search-bar input, .search-bar select { flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-size: 0.85rem; background: white; }

/* NAV */
nav.bottom-nav {
    position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around;
    padding: 10px 2px 12px; border-top: 1px solid var(--border); z-index: 1000; box-shadow: 0 -2px 10px rgba(20,33,61,0.05);
}
.nav-item { background: none; border: none; color: #97A3B5; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; font-weight: 600; cursor: pointer; flex: 1; padding: 2px; }
.nav-item.active { color: var(--primary); }
.nav-item svg { width: 21px; height: 21px; }

/* BOTONES */
.btn {
    background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600;
    width: 100%; cursor: pointer; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; display: flex; align-items: center; justify-content: center;
    gap: 8px; font-size: 0.88rem;
}
.btn:active { opacity: 0.85; }
.btn-accent { background: var(--accent); }
.btn-blue { background: var(--blue); }
.btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline.danger { color: var(--danger); border-color: var(--danger); }
.btn-danger { background: var(--danger); }
.btn-success { background: var(--success); }
.btn-sm { padding: 8px 14px; font-size: 0.75rem; width: auto; border-radius: 10px; }
.btn-ghost { background: none; color: var(--primary); width: auto; padding: 8px 10px; font-weight: 700; font-size: 0.78rem; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* BADGES / CHIPS */
.badge { padding: 5px 11px; border-radius: 8px; font-size: 0.68rem; font-weight: 700; white-space: nowrap; }
.bg-ok { background: var(--success-bg); color: var(--success); }
.bg-due { background: var(--danger-bg); color: var(--danger); }
.bg-warn { background: var(--warn-bg); color: var(--warn); }
.bg-neutral { background: #EEF1F6; color: var(--muted); }

.chip {
    padding: 8px 14px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; cursor: pointer; border: 1.5px solid transparent;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip.paid { background: var(--success-bg); color: var(--success); border-color: #BEEBD9; }
.chip.unpaid { background: var(--danger-bg); color: var(--danger); border-color: #F7CFCF; }

/* FORM */
.field { margin-bottom: 15px; }
.field label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.field input, .field select, .field textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-top: 6px;
    box-sizing: border-box; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-size: 0.88rem; background: #FBFCFE;
}
.field textarea { resize: vertical; min-height: 60px; }
.checkline { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.checkline input { width: 18px; height: 18px; }
.member-pick { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-top: 6px; }
.member-pick label { display: flex; align-items: center; gap: 8px; padding: 7px 4px; font-size: 0.82rem; font-weight: 500; text-transform: none; color: var(--text); }

/* MODAL */
.modal { position: fixed; inset: 0; background: rgba(11,21,38,0.55); display: none; align-items: flex-end; z-index: 2000; }
.modal.active { display: flex; }
.modal-body { background: white; width: 100%; border-radius: 26px 26px 0 0; padding: 26px; max-height: 88vh; overflow-y: auto; }
.modal-body h2 { margin-top: 0; font-size: 1.1rem; }
.modal-close-x { position: sticky; top: -26px; float: right; background: #EEF1F6; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: var(--muted); }

/* EMPTY STATE */
.empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 0.85rem; }

/* PROGRESS */
.progress-bar { height: 8px; background: #EEF1F6; border-radius: 6px; overflow: hidden; margin: 8px 0; }
.progress-bar > div { height: 100%; background: var(--success); }

/* RECEIPT / COMPROBANTE */
.receipt {
    background: white; border: 1.5px dashed var(--border); border-radius: 16px; padding: 22px; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;
}
.receipt-head { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 14px; margin-bottom: 14px; }
.receipt-head img { width: 46px; height: 46px; }
.receipt-head .rh-title { font-family:'Bricolage Grotesque',-apple-system,'Segoe UI',sans-serif; font-weight: 700; color: var(--primary); font-size: 1rem; }
.receipt-head .rh-sub { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.receipt-num { margin-left: auto; text-align: right; font-family: 'IBM Plex Mono'; font-size: 0.78rem; color: var(--muted); }
.receipt-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 0.85rem; border-bottom: 1px solid #F5F7FA; }
.receipt-row span:first-child { color: var(--muted); }
.receipt-total { display: flex; justify-content: space-between; padding-top: 14px; margin-top: 6px; font-family:'Bricolage Grotesque',-apple-system,'Segoe UI',sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--primary); }
.receipt-foot { margin-top: 18px; font-size: 0.7rem; color: var(--muted); text-align: center; }

/* TABLE (ledger etc.) */
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
table.tbl th { text-align: left; font-size: 0.65rem; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); padding: 8px 6px; letter-spacing: 0.4px; }
table.tbl td { padding: 9px 6px; border-bottom: 1px solid #F1F4F8; }
table.tbl tr:last-child td { border-bottom: none; }
.tbl-wrap { overflow-x: auto; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.muted { color: var(--muted); }
.text-danger { color: var(--danger); }
.text-success { color: var(--success); }
.text-warn { color: var(--warn); }
.small { font-size: 0.75rem; }
.mt { margin-top: 12px; }
.mb0 { margin-bottom: 0; }

.view { display: none; }
.view.active { display: block; }

.toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white;
    padding: 12px 20px; border-radius: 12px; font-size: 0.82rem; z-index: 3000; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

/* DESKTOP */
@media (min-width: 860px) {
    main { padding: 26px; }
    .dash-grid { grid-template-columns: repeat(4, 1fr); }
    nav.bottom-nav { max-width: 960px; left: 50%; transform: translateX(-50%); border-radius: 18px 18px 0 0; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .modal { align-items: center; justify-content: center; }
    .modal-body { max-width: 520px; border-radius: 22px; }
}

    
/* ---- agregados: unidades, reintegros, notas, recordatorios ---- */
.grp-title { display:flex; justify-content:space-between; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin:16px 4px 8px; }
.receipt-sign { margin-top:18px; text-align:right; font-size:0.8rem; color:var(--primary); }
.receipt-sign .rs-line { width:150px; border-top:1px solid #8a94a6; margin:22px 0 4px auto; }
.thumbs { display:flex; flex-wrap:wrap; gap:8px; }
.thumb { position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:#EEF1F6; cursor:pointer; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb button { position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(20,33,61,0.85); color:#fff; font-size:14px; line-height:1; cursor:pointer; padding:0; }
.pchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.pchip { display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border:1px solid var(--border); border-radius:20px; font-size:0.78rem; font-weight:600; text-transform:none; letter-spacing:0; color:var(--text); background:#fff; cursor:pointer; }
.pchip input { width:auto !important; margin:0; }
.field .pchip { font-size:0.78rem; font-weight:600; text-transform:none; letter-spacing:0; color:var(--text); }
.search-bar { flex-wrap: wrap; }
.search-bar input { flex: 1 1 100%; }
.search-bar select { flex: 1 1 40%; min-width: 0; }
#reminder-banner { position:fixed; top:8px; left:50%; transform:translateX(-50%); width:min(94vw,520px); z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.rem-item { pointer-events:auto; position:relative; background:var(--primary); color:#fff; border-radius:14px; padding:14px 38px 14px 16px; box-shadow:0 8px 24px rgba(20,33,61,0.35); font-size:0.85rem; line-height:1.45; }
.rem-item b { display:block; margin-bottom:4px; color:#E8CF95; }
.rem-item div { white-space:pre-line; }
.rem-item button { position:absolute; top:8px; right:10px; background:none; border:none; color:#fff; font-size:20px; cursor:pointer; }
.switch { position:relative; display:inline-block; width:44px; height:26px; flex:none; }
.switch input { opacity:0; width:0; height:0; }
.switch span { position:absolute; inset:0; background:#cfd6e2; border-radius:26px; transition:0.2s; cursor:pointer; }
.switch span:before { content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:0.2s; }
.switch input:checked + span { background:var(--success); }
.switch input:checked + span:before { transform:translateX(18px); }

/* =====================================================================
   REDISEÑO — tesorería con cinta de noticiero
   Marino de uniforme + dorado de galón; todo lo demás, quieto y claro.
   ===================================================================== */
:root {
    --primary: #0E1A33;
    --primary-light: #1A2B4F;
    --primary-dark: #0A1429;
    --gold: #D1A446;
    --accent: #B58F3C;
    --success: #148F66;
    --success-bg: #E2F5EC;
    --danger: #C93B26;
    --danger-bg: #FCEBE8;
    --warn: #A8650B;
    --warn-bg: #FDF1DC;
    --bg: #EEF1F6;
    --border: #DEE4EE;
    --text: #172033;
    --muted: #64748B;
    --display: 'Bricolage Grotesque', 'Figtree', sans-serif;
}
body { font-family: 'Figtree', -apple-system, sans-serif; background: var(--bg); }
h1, h2, h3, .modal-body h2 { font-family: var(--display); letter-spacing: -0.01em; }

/* ---- encabezado ---- */
header { background: var(--primary); padding: 10px 14px; border-bottom: 2px solid var(--gold); box-shadow: none; }
.header-wrap { gap: 10px; }
.logo-svg { width: 38px; height: 38px; }
.brand { min-width: 0; }
header h1 { font-family: var(--display); font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header p { text-transform: none; letter-spacing: 0.2px; font-size: 0.72rem; color: #9FB3D9; opacity: 1; margin-top: 1px; }
.icon-btn { background: transparent; border: none; width: 40px; height: 40px; border-radius: 12px; color: #fff; }
.icon-btn:active { background: rgba(255,255,255,0.12); }
.icon-btn svg, .ic { width: 22px; height: 22px; }
.header-actions { gap: 0; }

/* ---- cinta (fina, plana) ---- */
.cinta { display: none; position: sticky; top: var(--hdr-h, 62px); z-index: 900; height: 32px; color: #fff; overflow: hidden; background: #0A1429; border-bottom: 1px solid rgba(255,255,255,0.06); }
body[data-view="inicio"] .cinta { display: flex; }
.cinta-tag { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 14px; color: #9FB3D9; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.02em; position: relative; z-index: 2; background: #0A1429; border-right: 1px solid rgba(255,255,255,0.1); }
.cinta-tag .ic { width: 14px; height: 14px; stroke-width: 2; }
.cinta-view { flex: 1; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent); }
.cinta-track { display: flex; align-items: center; width: max-content; height: 32px; animation: cinta var(--dur, 70s) linear infinite; will-change: transform; }
.cinta:hover .cinta-track, .cinta.paused .cinta-track { animation-play-state: paused; }
@keyframes cinta { to { transform: translateX(-50%); } }
.ci { display: flex; align-items: baseline; gap: 7px; background: none; border: none; color: #fff; font-family: inherit; cursor: pointer; white-space: nowrap; padding: 0; }
.ci .k { font-size: 0.72rem; font-weight: 500; color: #7F95C0; }
.ci b { font-family: var(--display); font-weight: 600; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.ci .d { font-style: normal; font-size: 0.68rem; font-weight: 600; }
.ci .d.good { color: #6FE0B2; } .ci .d.bad { color: #FF9B86; }
.ci.good b { color: #6FE0B2; } .ci.warn b { color: #E9C77B; } .ci.bad b { color: #FF9B86; }
.ci-sep { flex: none; width: 3px; height: 3px; border-radius: 50%; margin: 0 20px; background: rgba(255,255,255,0.25); }

/* ---- inicio ---- */
.home-hello h2 { font-size: 1.7rem; margin: 6px 0 2px; font-weight: 700; }
.home-hello p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
.home-hello p::first-letter { text-transform: uppercase; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 22px; }
.hero-label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
.hero-num { font-family: var(--display); font-weight: 800; font-size: 2.35rem; letter-spacing: -0.03em; color: var(--primary); line-height: 1.1; margin: 4px 0 10px; }
.hero-sub { font-size: 0.82rem; color: var(--muted); cursor: pointer; }
.hero-sub b { white-space: nowrap; color: var(--warn); font-family: var(--display); font-size: 0.95rem; }
.hero-ring { flex: none; position: relative; width: 118px; text-align: center; cursor: pointer; }
.hero-ring svg { width: 118px; height: 118px; transform: rotate(-90deg); display: block; }
.hero-ring .trk { fill: none; stroke: #F2B84B; stroke-width: 13; opacity: 0.35; }
.hero-ring .arc { fill: none; stroke: var(--success); stroke-width: 13; stroke-linecap: round; transition: stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1); }
.hero-ring .pct { position: absolute; top: 0; left: 0; width: 118px; height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 1.5rem; color: var(--primary); }
.hero-ring .pct small { font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-weight: 600; font-size: 0.66rem; color: var(--muted); margin-top: -2px; }
.home-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 6px; }
.act { background: var(--primary); color: #fff; border: none; border-radius: 18px; min-height: 96px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-align: center; line-height: 1.2; }
.act .ic { width: 26px; height: 26px; color: var(--gold); }
.act:active { background: var(--primary-light); }
.home-att h3 { font-size: 1.05rem; margin: 22px 0 4px; }
.att { display: flex; align-items: center; gap: 12px; padding: 14px 2px; border-bottom: 1px solid var(--border); cursor: pointer; }
.att:last-child { border-bottom: none; }
.att::before { content: ""; align-self: stretch; width: 4px; border-radius: 2px; background: var(--tone, var(--gold)); flex: none; }
.att .t { flex: 1; font-weight: 700; font-size: 0.92rem; }
.att .t small { display: block; font-weight: 500; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.att .ic { width: 18px; height: 18px; color: var(--muted); flex: none; }
.att-ok { padding: 18px 2px; color: var(--muted); font-size: 0.9rem; }

/* ---- navegación inferior con botón + ---- */
nav.bottom-nav { padding: 8px 4px calc(10px + env(safe-area-inset-bottom)); align-items: flex-end; box-shadow: 0 -1px 0 var(--border); }
.nav-item { position: relative; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-size: 0.68rem; color: #8492A6; padding: 4px 2px; }
.nav-item .ic { width: 23px; height: 23px; }
.nav-item.active { color: var(--primary); }
.nav-item.active::before { content: ""; position: absolute; top: -9px; width: 24px; height: 3px; border-radius: 2px; background: var(--gold); }
.nav-fab { flex: none; width: 60px; height: 60px; margin: -30px 4px 4px; border-radius: 50%; background: var(--gold); color: var(--primary); border: 5px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 1px var(--border); }
.nav-fab .ic { width: 28px; height: 28px; stroke-width: 2.6; }
.nav-fab:active { transform: scale(0.94); }
.toast { bottom: 108px; }

/* ---- menú lateral ---- */
#drawer-overlay { position: fixed; inset: 0; background: rgba(10,20,41,0.55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 2500; }
#drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 340px); background: #fff; transform: translateX(-104%); transition: transform .26s cubic-bezier(.3,.8,.3,1); z-index: 2600; overflow-y: auto; padding-bottom: 30px; visibility: hidden; }
body.drawer-open #drawer { transform: none; visibility: visible; }
body.drawer-open #drawer-overlay { opacity: 1; pointer-events: auto; }
.dr-head { display: flex; align-items: center; gap: 12px; padding: 18px 16px; background: var(--primary); color: #fff; border-bottom: 2px solid var(--gold); }
.dr-head img { width: 40px; height: 40px; object-fit: contain; }
.dr-head b { font-family: var(--display); font-size: 1.02rem; display: block; line-height: 1.15; }
.dr-head small { color: #9FB3D9; font-size: 0.74rem; }
.dr-head button { margin-left: auto; background: none; border: none; color: #fff; cursor: pointer; padding: 6px; }
.dr-group { padding: 16px 12px 4px; }
.dr-group h4 { margin: 0 8px 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.dr-item { display: flex; align-items: center; gap: 14px; width: 100%; background: none; border: none; padding: 12px 8px; border-radius: 12px; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-weight: 600; font-size: 0.95rem; color: var(--text); cursor: pointer; text-align: left; }
.dr-item .ic { width: 20px; height: 20px; color: var(--accent); }
.dr-item:active, .dr-item:focus-visible { background: #EEF1F6; }

/* ---- hoja de acciones (+) y buscador ---- */
.qa-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.qa { display: flex; align-items: center; gap: 12px; padding: 16px 14px; border: 1px solid var(--border); border-radius: 16px; background: #fff; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--primary); cursor: pointer; text-align: left; }
.qa .ic { width: 22px; height: 22px; color: var(--accent); flex: none; }
.qa:active { background: #EEF1F6; }
.sr-input { width: 100%; padding: 14px 16px; font-size: 1rem; border-radius: 14px; border: 1.5px solid var(--primary); font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; box-sizing: border-box; }
.sr-group { font-size: 0.78rem; font-weight: 700; color: var(--muted); margin: 16px 2px 4px; }

/* ---- pulido general ---- */
.card { border-radius: 16px; box-shadow: none; }
.field label { text-transform: none; letter-spacing: 0; font-size: 0.82rem; font-weight: 700; color: var(--text); }
.field input, .field select, .field textarea { background: #fff; border-color: #CBD4E2; border-radius: 12px; padding: 13px; }
.field input:focus, .field select:focus, .field textarea:focus, .sr-input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.btn { border-radius: 14px; padding: 15px; font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-weight: 700; }
.btn-accent { background: var(--gold); color: var(--primary); }
.btn-sm { padding: 9px 14px; }
.tab-btn { font-family:'Figtree',-apple-system,'Segoe UI',sans-serif; font-weight: 700; border-radius: 12px; padding: 9px 14px; color: #55657C; }
.tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
table.tbl th { text-transform: none; font-size: 0.74rem; letter-spacing: 0; }
.receipt-head .rh-sub { text-transform: none; letter-spacing: 0; font-size: 0.78rem; }
.grp-title { text-transform: none; letter-spacing: 0; font-size: 0.8rem; }
.section-title h2 { font-size: 1.3rem; }
#mem-summary { margin: -6px 0 12px; font-size: 0.82rem; color: var(--muted); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.modal-body { border-radius: 24px 24px 0 0; padding-top: 14px; }
.modal-body::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: #CBD4E2; margin: 0 auto 14px; }
.modal.active .modal-body { animation: hoja .24s cubic-bezier(.2,.8,.2,1); }
@keyframes hoja { from { transform: translateY(46px); opacity: 0.4; } }
#reminder-banner { top: 74px; }

@media (min-width: 860px) {
    .hero-num { font-size: 3rem; }
    .home-actions { grid-template-columns: repeat(3, 1fr); }
    .act { min-height: 110px; flex-direction: row; justify-content: center; gap: 14px; font-size: 0.95rem; }
}
@media (prefers-reduced-motion: reduce) {
    .cinta-track { animation: none; }
    .cinta-view { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
    .modal.active .modal-body { animation: none; }
    .hero-ring .arc { transition: none; }
    #drawer { transition: none; }
}

.btn-ghost { border: none; }

/* ---- minimalismo: marino + blanco, logo protagonista ---- */
:root { --gold: #3F67C2; --accent: #3F67C2; }
header { background: var(--primary); padding: 12px 16px; border-bottom: 0; position: sticky; }
.logo-svg { width: 54px; height: 54px; }
.logo-svg img { width: 100%; height: 100%; object-fit: contain; }
header h1 { font-size: 1.15rem; font-weight: 600; }
header p { font-size: 0.74rem; }
.hero { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
.hero-ring .trk { stroke: #E6EBF4; opacity: 1; }
.hero-sub b { color: var(--text); }
.home-actions { gap: 8px; }
.act { background: #fff; color: var(--primary); border: 1px solid var(--border); border-radius: 16px; min-height: 80px; font-weight: 600; font-size: 0.84rem; }
.act .ic { color: var(--primary); width: 24px; height: 24px; stroke-width: 1.7; }
.act:active { background: #F3F6FB; }
.nav-item.active::before { background: var(--primary); height: 2px; }
.nav-fab { background: var(--primary); color: #fff; border: 4px solid #fff; box-shadow: 0 0 0 1px var(--border); width: 54px; height: 54px; margin-top: -26px; }
.btn-accent { background: var(--primary); color: #fff; }
.btn { box-shadow: none; }
.card { box-shadow: none; border: 1px solid var(--border); }
.att::before { width: 3px; }
.dr-head { background: var(--primary); border-bottom: 0; }
.dr-head img { width: 52px; height: 52px; }
.btn-ghost { border: none; }
header h1 { font-size: 1.02rem; white-space: normal; line-height: 1.15; overflow: visible; text-overflow: clip; }

/* ---- historial ---- */
.hist { padding: 4px 14px 10px; }
.hist-day { margin: 14px 0 2px; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.hist-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.hist-row:last-child { border-bottom: none; }
.hist-ic { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #E8EEF9; color: var(--primary); display: grid; place-items: center; }
.hist-ic .ic { width: 16px; height: 16px; }
.hist-t { flex: 1; font-size: 0.88rem; font-weight: 600; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.hist-t small { display: block; color: var(--muted); font-weight: 500; font-size: 0.74rem; margin-top: 2px; }
.hist-m { flex: none; font-family: var(--display); font-size: 0.9rem; }
.pchips { display: flex; gap: 6px; flex-wrap: wrap; }
.pchips .tab-btn { padding: 7px 12px; }

i[data-ic] { display: flex; }
</style>
</head>

<div id="reminder-banner"></div>
<div id="cinta" class="cinta" aria-label="Resumen de las finanzas">
    <div class="cinta-tag"><i data-ic="chart"></i><span>Tesorería</span></div>
    <div class="cinta-view"><div class="cinta-track" id="cinta-track"></div></div>

<main>
    <!-- ================= INICIO ================= -->
    <section id="v-inicio" class="view active">
        <div class="home-hello"><h2 id="home-greeting">Hola</h2><p id="home-date"></p></div>
        <div class="hero" id="home-hero"></div>
        <div class="home-actions" id="home-actions"></div>
        <div class="home-att" id="home-att"></div>
        <div id="seed-wrap"></div>
    </section>

    <!-- ================= MIEMBROS ================= -->
    <section id="v-miembros" class="view">
        <div class="section-title">
            <h2>Miembros</h2>
            <div style="display:flex; gap:6px">
                <button class="btn btn-sm btn-outline" onclick="openUnitsModal()">Unidades</button>
                <button class="btn btn-sm btn-accent" onclick="openMemberModal()">+ Nuevo</button>
            </div>
        </div>
        <div id="mem-summary"></div>
        <div class="search-bar">
            <input id="mem-search" type="text" placeholder="Buscar por nombre..." oninput="renderAll()">
            <select id="mem-filter" onchange="renderAll()">
                <option value="">Todas las categorías</option>
                <option value="Directivo">Directivos</option>
                <option value="Consejero">Consejeros</option>
                <option value="Conquistador">Conquistadores</option>
                <option value="brasil">Solo Brasil</option>
                <optgroup id="mem-filter-units" label="Unidades"></optgroup>
                <option value="archivados">Archivados</option>
            </select>
            <select id="mem-group" onchange="renderAll()">
                <option value="">Sin agrupar</option>
                <option value="unidad">Agrupar por unidad</option>
                <option value="cat">Agrupar por categoría</option>
            </select>
        </div>
        <div id="list-miembros"></div>
    </section>

    <!-- ================= CUOTAS ================= -->
    <section id="v-cuotas" class="view">
        <div class="section-title">
            <h2>Cuotas</h2>
            <button class="btn btn-sm btn-outline" onclick="openCuotaSettingsModal()">Configurar</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-cuotatab="normal" onclick="setCuotaTab('normal')">Cuota mensual</button>
            <button class="tab-btn" data-cuotatab="brasil" onclick="setCuotaTab('brasil')">Cuota Brasil</button>
            <button class="tab-btn" data-cuotatab="pendientes" onclick="setCuotaTab('pendientes')">Pendientes (todas)</button>
        </div>
        <div id="cuota-period-label" class="small muted mb0" style="margin-bottom:10px"></div>
        <div id="list-cuotas"></div>
    </section>

    <!-- ================= EVENTOS ================= -->
    <section id="v-eventos" class="view">
        <div class="section-title">
            <h2>Eventos y proyectos</h2>
            <button class="btn btn-sm btn-accent" onclick="openEventModal()">+ Crear</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-eventtab="activos" onclick="setEventTab('activos')">Activos</button>
            <button class="tab-btn" data-eventtab="archivados" onclick="setEventTab('archivados')">Finalizados</button>
        </div>
        <div id="list-eventos"></div>
    </section>

    <!-- ================= FINANZAS ================= -->
    <section id="v-finanzas" class="view">
        <div class="section-title"><h2>Finanzas</h2></div>
        <div class="tabs">
            <button class="tab-btn active" data-fintab="diario" onclick="setFinTab('diario')">Libro Diario</button>
            <button class="tab-btn" data-fintab="mayor" onclick="setFinTab('mayor')">Mayor</button>
            <button class="tab-btn" data-fintab="cuentas" onclick="setFinTab('cuentas')">Plan de Cuentas</button>
            <button class="tab-btn" data-fintab="balance" onclick="setFinTab('balance')">Balance</button>
            <button class="tab-btn" data-fintab="resultados" onclick="setFinTab('resultados')">Resultados</button>
            <button class="tab-btn" data-fintab="informes" onclick="setFinTab('informes')">Informes</button>
        </div>
        <div id="fin-content"></div>
    </section>

    <!-- ================= MAS (Comprobantes / Inventario) ================= -->
    <section id="v-mas" class="view">
        <div class="section-title"><h2>Más</h2></div>
        <div class="tabs">
            <button class="tab-btn active" data-mastab="comprobantes" onclick="setMasTab('comprobantes')">Comprobantes</button>
            <button class="tab-btn" data-mastab="reintegros" onclick="setMasTab('reintegros')">Reintegros</button>
            <button class="tab-btn" data-mastab="notas" onclick="setMasTab('notas')">Notas</button>
            <button class="tab-btn" data-mastab="recordatorios" onclick="setMasTab('recordatorios')">Recordatorios</button>
            <button class="tab-btn" data-mastab="inventario" onclick="setMasTab('inventario')">Inventario</button>
            <button class="tab-btn" data-mastab="historial" onclick="setMasTab('historial')">Historial</button>
        </div>
        <div id="mas-content"></div>
    </section>
</main>

function deepMergeDefaults(target, defaults) {
    for (const k in defaults) {
        if (!(k in target) || target[k] === undefined || target[k] === null) {
            target[k] = defaults[k];
        } else if (typeof defaults[k] === 'object' && !Array.isArray(defaults[k])) {
            target[k] = deepMergeDefaults(target[k], defaults[k]);
        }
    }
    return target;
}

var db;

function migrateChargesToPartialPayments() {
    (db.charges || []).forEach(c => {
        if (c.paid && !(c.amountPaid > 0)) {
            c.amountPaid = c.amount;
            if (!c.payments || !c.payments.length) {
                c.payments = [{ id: uid('pg'), amount: c.amount, date: c.paidDate || todayStr(), entryId: c.entryId || null, receiptId: c.receiptId || null }];
            }
        }
        if (c.amountPaid == null) c.amountPaid = 0;
        if (!c.payments) c.payments = [];
    });
}

/* Limpieza de compatibilidad: la cuota mensual normal solo corre de Marzo a
   Diciembre. Si quedaron cargos de Enero/Febrero generados por una versión
   anterior y todavía no se pagaron, se archivan (el historial ya pagado no
   se toca). */
/* Limpieza automática de cargos que no deberían figurar como deuda:
   (a) cargos de meses fuera de temporada (antes de Marzo/Abril), y
   (b) cargos de meses que todavía no llegaron (no devengados) y que no
   tienen ningún pago registrado — típicamente datos viejos que quedaron
   guardados de antes de aplicar el criterio de lo devengado.
   Si un cargo futuro ya tiene un pago parcial cargado, se deja tal cual
   (se revisa a mano desde "Pendientes") para no perder ese registro. */
function archiveOutOfSeasonCuotaCharges() {
    const cur = currentPeriod();
    (db.charges || []).forEach(c => {
        if ((c.sourceType === 'cuota-normal' || c.sourceType === 'cuota-brasil') && c.period && !c.archived && !isFullyPaid(c)) {
            const mes = parseInt(c.period.split('-')[1], 10);
            const esInscripcion = c.sourceType === 'cuota-normal' && mes === 0;
            const mesInicio = c.sourceType === 'cuota-normal' ? cfgNormalIni() : cfgBrasilIni();
            const mesFin = c.sourceType === 'cuota-normal' ? cfgNormalFin() : cfgBrasilFin();
            const fueraDeTemporada = esInscripcion ? (!cfgInscripcion() && !c.amountPaid) : ((mes < mesInicio || mes > mesFin) && !c.amountPaid);
            const futuroSinPago = c.period > cur && !c.amountPaid;
            if (fueraDeTemporada || futuroSinPago) c.archived = true;
        }
    });
}

function loadDB() {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
        try {
            db = JSON.parse(raw);
        } catch (e) {
            db = defaultDB();
        }
        db = deepMergeDefaults(db, defaultDB());
        defaultDB().accounts.forEach(a => {
            if (!db.accounts.find(x => x.id === a.id)) db.accounts.push(a);
        });
        // compatibilidad con versiones anteriores que solo tenían "paid" (sin pagos parciales)
        migrateChargesToPartialPayments();
        archiveOutOfSeasonCuotaCharges();
    } else {
        db = defaultDB();
        const old = localStorage.getItem(OLD_DB_KEY);
        if (old) {
            try {
                const o = JSON.parse(old);
                if (Array.isArray(o.members)) {
                    db.members = o.members.map(m => ({ id: String(m.id), name: m.name, cat: m.cat, brasil: !!m.brasil, archived: false }));
                }
                if (Array.isArray(o.entries)) {
                    db.entries = o.entries.map(e => ({
                        id: 'mig' + e.id, fecha: e.fecha, desc: e.desc,
                        debe: e.debe, haber: e.haber, monto: e.monto, voided: false
                    }));
                }
                if (Array.isArray(o.accounts)) {
                    o.accounts.forEach(a => {
                        const ex = db.accounts.find(x => x.id === a.id);
                        if (ex) ex.opening = a.balance || 0;
                        else db.accounts.push({ id: a.id, name: a.name, type: a.type || 'activo', naturaleza: 'deudora', desc: 'Cuenta migrada de la versión anterior.', system: false, opening: a.balance || 0 });
                    });
                }
                showToast('Se importaron los datos de la versión anterior de la app.');
            } catch (e) { console.warn('migración falló', e); }
        }
    }
    // Los informes siempre salen a nombre de la agrupación (corrige datos que hayan
    // quedado con el nombre de otro club)
    if (!db.settings.clubName || /club\s+victoria/i.test(db.settings.clubName)) db.settings.clubName = 'Agrupación San Martín';
    if (!db.settings.tesorero) db.settings.tesorero = 'Matías Leal';
    ['units', 'notes', 'reintegros', 'extraNames'].forEach(k => { if (!Array.isArray(db[k])) db[k] = []; });
    ensureAllCuotaCharges();
    save(true);
}

function save(skipRender) {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    if (!skipRender) renderAll();
}

function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function todayStr() { return new Date().toLocaleDateString('es-AR'); }

/* ---- Fechas: se guardan como d/m/aaaa (igual que siempre), pero los
   formularios usan selector de fecha para poder cargar movimientos viejos ---- */
function isoToFecha(iso) {
    if (!iso) return todayStr();
    const p = iso.split('-').map(Number);
    return p[2] + '/' + p[1] + '/' + p[0];
}
function fechaToISO(f) {
    if (!f) return '';
    f = String(f).trim();
    let m = f.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    m = f.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    return '';
}
function fechaPeriod(f) { const i = fechaToISO(f); return i ? i.slice(0, 7) : ''; }
function sortEntries(arr) {
    return arr.slice().sort((a, b) => {
        const fa = fechaToISO(a.fecha), fb = fechaToISO(b.fecha);
        if (fa !== fb) return fa.localeCompare(fb);
        return a.id.localeCompare(b.id);
    });
}
function byId(id) { return document.getElementById(id); }
function arsStr(n) { return 'ARS ' + Math.round(n || 0).toLocaleString('es-AR'); }
function pctStr(a, b) { return b > 0 ? (a / b * 100).toFixed(1).replace('.', ',') + '%' : '—'; }
function tesoreroName() { return (db.settings.tesorero || '').trim(); }
function clubSlug() {
    return (db.settings.clubName || 'Club').normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'Club';
}
function shortPeriodLabel(p) {
    const [y, m] = p.split('-').map(Number);
    return m === 0 ? 'Insc.' : MESES[m - 1] + ' ' + String(y).slice(2);
}

/* ---- Unidades (solo Conquistadores y Consejeros; los Directivos no van a ninguna) ---- */
function unitsList() { return [...(db.units || [])].sort((a, b) => a.name.localeCompare(b.name, 'es')); }
function unitName(id) { const u = (db.units || []).find(x => x.id === id); return u ? u.name : ''; }
function getOrCreateUnit(name) {
    name = name.trim();
    const ex = (db.units || []).find(u => u.name.toLowerCase() === name.toLowerCase());
    if (ex) return ex.id;
    const u = { id: uid('un'), name };
    db.units.push(u);
    return u.id;
}

function fmt(n) {
    n = Math.round(n || 0);
    return '$ ' + n.toLocaleString('es-AR');
}

/* ---------------------------------------------------------------------
   PERÍODOS (YYYY-MM)
   --------------------------------------------------------------------- */
function currentPeriod() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function addMonths(period, n) {
    let [y, m] = period.split('-').map(Number);
    m += n;
    while (m > 12) { m -= 12; y++; }
    while (m < 1) { m += 12; y--; }
    return y + '-' + String(m).padStart(2, '0');
}
function periodRange(start, end) {
    const out = [];
    let p = start;
    let guard = 0;
    while (p <= end && guard < 600) { out.push(p); p = addMonths(p, 1); guard++; }
    return out;
}
function periodLabel(p) {
    if (!p) return '';
    const [y, m] = p.split('-').map(Number);
    return m === 0 ? 'Inscripción ' + y : MESES[m - 1] + ' ' + y;
}

/* ---------------------------------------------------------------------
   CONTABILIDAD BÁSICA
   --------------------------------------------------------------------- */
function getBalance(accId) {
    const acc = db.accounts.find(a => a.id === accId);
    let bal = acc ? (acc.opening || 0) : 0;
    db.entries.forEach(e => {
        if (e.voided) return;
        if (e.debe === accId) bal += e.monto;
        if (e.haber === accId) bal -= e.monto;
    });
    // Las cuentas de naturaleza acreedora (pasivo, patrimonio, ingreso) muestran
    // su saldo "normal" invertido respecto del cálculo débito-crédito crudo,
    // igual que en cualquier libro mayor tradicional.
    if (acc && acc.naturaleza === 'acreedora') bal = -bal;
    return bal;
}
function accountLabel(id) {
    const a = db.accounts.find(x => x.id === id);
    return a ? a.name : id;
}
function postEntry(desc, debe, haber, monto, fecha) {
    const e = { id: uid('e'), fecha: fecha || todayStr(), desc, debe, haber, monto: Math.round(monto), voided: false };
    db.entries.push(e);
    return e;
}

/* ---------------------------------------------------------------------
   COMPROBANTES
   --------------------------------------------------------------------- */
function nextComprobanteNumber() {
    const n = db.settings.nextComprobanteNum || 1;
    db.settings.nextComprobanteNum = n + 1;
    return n;
}
function receiptMeta(tipo) {
    const map = {
        'cuota-normal': { title: 'Recibo de Cuota Mensual', badge: 'Cuota mensual' },
        'cuota-brasil': { title: 'Recibo de Cuota Brasil', badge: 'Cuota Brasil' },
        'evento': { title: 'Comprobante de Evento / Proyecto', badge: 'Evento / Proyecto' },
        'reintegro': { title: 'Comprobante de Reintegro', badge: 'Reintegro' },
        'libre': { title: 'Comprobante de pago', badge: 'Pago' }
    };
    return map[tipo] || { title: 'Comprobante', badge: tipo };
}
function makeComprobante(tipo, memberId, concepto, monto, entryId, opts) {
    opts = opts || {};
    const m = memberId ? db.members.find(x => x.id === memberId) : null;
    const c = {
        id: uid('c'), numero: nextComprobanteNumber(), tipo,
        memberId: memberId || null, memberName: opts.memberName || (m ? m.name : '—'),
        titulo: opts.titulo || '',
        concepto, monto, fecha: opts.fecha || todayStr(), entryId, voided: false
    };
    db.comprobantes.push(c);
    return c;
}

/* ---------------------------------------------------------------------
   MIEMBROS
   --------------------------------------------------------------------- */
function activeMembers() { return db.members.filter(m => !m.archived); }

function memberCharges(memberId, opts) {
    opts = opts || {};
    return db.charges.filter(c => c.memberId === memberId && (opts.includeArchived || !c.archived) &&
        (!opts.sourceType || c.sourceType === opts.sourceType));
}
function chargeRemaining(c) { return Math.max(0, c.amount - (c.amountPaid || 0)); }
function isFullyPaid(c) { return chargeRemaining(c) <= 0; }
function memberDebt(memberId, sourceType) {
    return memberCharges(memberId, { sourceType }).reduce((s, c) => s + chargeRemaining(c), 0);
}
function totalPendienteMiembros() {
    return db.charges.filter(c => !c.archived).reduce((s, c) => s + chargeRemaining(c), 0);
}

function saveMember(mid) {
    const name = byId('f-name').value.trim();
    const cat = byId('f-cat').value;
    const brasil = byId('f-brasil').checked;
    const claseEl = byId('f-clase');
    const clase = (cat === 'Conquistador' && claseEl) ? claseEl.value : null;
    const cuotaStartEl = byId('f-cuotastart');
    const cuotaStart = (cuotaStartEl && cuotaStartEl.value) ? cuotaStartEl.value : null;
    if (!name) { alert('El nombre es obligatorio.'); return; }
    // Unidad: solo Conquistadores y Consejeros (los Directivos no pertenecen a ninguna)
    let unit = null;
    if (cat !== 'Directivo') {
        const uSel = byId('f-unit');
        if (uSel) {
            if (uSel.value === '__new__') {
                const un = byId('f-unit-new').value.trim();
                if (!un) { alert('Escribí el nombre de la nueva unidad (o elegí otra opción).'); return; }
                unit = getOrCreateUnit(un);
            } else {
                unit = uSel.value || null;
            }
        }
    }
    if (mid) {
        const m = db.members.find(x => x.id === mid);
        m.name = name; m.cat = cat; m.brasil = brasil; m.clase = clase; m.cuotaStart = cuotaStart; m.unit = unit;
    } else {
        const m = { id: uid('m'), name, cat, brasil, clase, cuotaStart, unit, archived: false };
        db.members.push(m);
        ensureCuotaCharges(m);
    }
    closeModal();
    ensureAllCuotaCharges();
    save();
    showToast('Miembro guardado.');
}

function archiveMember(mid) {
    if (!confirm('¿Archivar este miembro? No se eliminarán sus datos ni su historial, solo dejará de aparecer en las listas activas.')) return;
    const m = db.members.find(x => x.id === mid);
    if (m) m.archived = true;
    closeModal();
    save();
    showToast('Miembro archivado.');
}
function unarchiveMember(mid) {
    const m = db.members.find(x => x.id === mid);
    if (m) m.archived = false;
    closeModal();
    save();
    showToast('Miembro restaurado.');
}
function deleteMember(mid) {
    const m = db.members.find(x => x.id === mid);
    if (!m) return;
    if (!confirm('¿ELIMINAR DEFINITIVAMENTE a ' + m.name + '? Esta acción no se puede deshacer. Los comprobantes y movimientos contables ya generados se conservan (no se altera la contabilidad histórica), pero el miembro dejará de existir en el sistema.')) return;
    db.charges.filter(c => c.memberId === mid).forEach(c => { c.archived = true; });
    db.members = db.members.filter(x => x.id !== mid);
    closeModal();
    save();
    showToast('Miembro eliminado.');
}

/* ---- Configuración de cuotas (todo editable desde "Configurar") ---- */
function cfgNum(v, d) { v = parseInt(v, 10); return (v >= 1 && v <= 12) ? v : d; }
function cfgNormalIni() { return cfgNum(db.settings.cuotaNormalMesInicio, 3); }
function cfgNormalFin() { return cfgNum(db.settings.cuotaNormalMesFin, 11); }
function cfgBrasilIni() { return cfgNum(db.settings.cuotaBrasilMesInicio, 4); }
function cfgBrasilFin() { return cfgNum(db.settings.cuotaBrasilMesFin, 12); }
function cfgInscripcion() { return db.settings.cuotaNormalInscripcion !== false; }
function cfgInscripcionMonto() {
    const v = parseFloat(db.settings.cuotaInscripcionMonto);
    return v > 0 ? v : db.settings.cuotaNormalMonto;
}
function yearBounds(year) { return [year + '-01', year + '-12']; }

/* Genera automáticamente las cuotas normales (solo Conquistadores: inscripción
   opcional + los meses configurados) y de Brasil (meses configurados), con el
   criterio de lo devengado: solo se generan cargos hasta el mes en curso
   (inclusive), nunca de meses futuros. Los montos y el rango de meses salen de
   la configuración, así que cualquier cambio se refleja en los cargos aún no
   pagados. */
function ensureCuotaCharges(member) {
    const cur = currentPeriod();
    const year = cur.slice(0, 4);
    const nStart = year + '-' + String(cfgNormalIni()).padStart(2, '0');
    const nFullEnd = year + '-' + String(cfgNormalFin()).padStart(2, '0');
    const nEnd = cur < nFullEnd ? cur : nFullEnd;
    const nFrom = (member.cuotaStart && member.cuotaStart > nStart) ? member.cuotaStart : nStart;

    if (member.cat === 'Conquistador') {
        const inscP = year + '-00';
        const insc = db.charges.find(c => c.memberId === member.id && c.sourceType === 'cuota-normal' && c.period === inscP);
        if (cfgInscripcion()) {
            if (insc) {
                if (insc.archived) insc.archived = false;
                if (!insc.amountPaid) insc.amount = cfgInscripcionMonto();
            } else {
                db.charges.push({
                    id: uid('ch'), sourceType: 'cuota-normal', sourceId: null, memberId: member.id,
                    period: inscP, concept: 'Cuota mensual Inscripción ' + year, amount: cfgInscripcionMonto(),
                    amountPaid: 0, payments: [], paid: false, archived: false
                });
            }
        } else if (insc && !insc.amountPaid) {
            insc.archived = true;
        }

        periodRange(nFrom, nEnd).forEach(p => {
            const existing = db.charges.find(c => c.memberId === member.id && c.sourceType === 'cuota-normal' && c.period === p);
            if (existing) {
                if (existing.archived) existing.archived = false;
                if (!existing.amountPaid) existing.amount = db.settings.cuotaNormalMonto;
            } else {
                db.charges.push({
                    id: uid('ch'), sourceType: 'cuota-normal', sourceId: null, memberId: member.id,
                    period: p, concept: 'Cuota mensual ' + periodLabel(p), amount: db.settings.cuotaNormalMonto,
                    amountPaid: 0, payments: [], paid: false, archived: false
                });
            }
        });
    } else {
        // la cuota mensual normal solo la pagan los Conquistadores
        db.charges.filter(c => c.memberId === member.id && c.sourceType === 'cuota-normal' && !isFullyPaid(c))
            .forEach(c => { c.archived = true; });
    }

    if (member.brasil) {
        const bStart = year + '-' + String(cfgBrasilIni()).padStart(2, '0');
        const bFullEnd = year + '-' + String(cfgBrasilFin()).padStart(2, '0');
        const bEnd = cur < bFullEnd ? cur : bFullEnd;
        const bFrom = (member.cuotaStart && member.cuotaStart > bStart) ? member.cuotaStart : bStart;
        periodRange(bFrom, bEnd).forEach(p => {
            const existing = db.charges.find(c => c.memberId === member.id && c.sourceType === 'cuota-brasil' && c.period === p);
            if (existing) {
                if (existing.archived) existing.archived = false;
                if (!existing.amountPaid) existing.amount = db.settings.cuotaBrasilMonto;
            } else {
                db.charges.push({
                    id: uid('ch'), sourceType: 'cuota-brasil', sourceId: null, memberId: member.id,
                    period: p, concept: 'Cuota Brasil ' + periodLabel(p), amount: db.settings.cuotaBrasilMonto,
                    amountPaid: 0, payments: [], paid: false, archived: false
                });
            }
        });
    } else {
        db.charges.filter(c => c.memberId === member.id && c.sourceType === 'cuota-brasil' && !isFullyPaid(c))
            .forEach(c => { c.archived = true; });
    }
}
function ensureAllCuotaCharges() { activeMembers().forEach(ensureCuotaCharges); }

/* Desde qué período le corresponde la cuota a un miembro dado, para un año
   determinado (usado para habilitar el pago adelantado de meses futuros en
   la grilla, respetando la fecha de ingreso del miembro si es posterior). */
function cuotaFromForYear(member, sourceType, year) {
    const mesInicio = sourceType === 'cuota-normal' ? cfgNormalIni() : cfgBrasilIni();
    const start = year + '-' + String(mesInicio).padStart(2, '0');
    return (member.cuotaStart && member.cuotaStart > start) ? member.cuotaStart : start;
}
function cuotaToForYear(sourceType, year) {
    const mesFin = sourceType === 'cuota-normal' ? cfgNormalFin() : cfgBrasilFin();
    return year + '-' + String(mesFin).padStart(2, '0');
}

/* ---------------------------------------------------------------------
   PAGOS — admite pagos parciales (por si dan una parte y no el mes completo)
   --------------------------------------------------------------------- */
function chargeHaberAccount(c) {
    if (c.sourceType === 'cuota-normal') return 'cuotas-ingresos';
    if (c.sourceType === 'cuota-brasil') return 'brasil-ingresos';
    const ev = db.events.find(x => x.id === c.sourceId);
    return ev ? ev.accountResultId : 'cuotas-ingresos';
}
function chargeComprobanteTipo(c) {
    if (c.sourceType === 'cuota-normal') return 'cuota-normal';
    if (c.sourceType === 'cuota-brasil') return 'cuota-brasil';
    return 'evento';
}

function registerChargePayment(chargeId, amount, fechaISO) {
    const c = db.charges.find(x => x.id === chargeId);
    if (!c) return;
    const restante = chargeRemaining(c);
    if (!amount || amount <= 0) { alert('Ingresá un monto válido.'); return; }
    if (amount > restante + 0.01) { alert('El monto no puede superar lo pendiente (' + fmt(restante) + ').'); return; }
    const m = db.members.find(x => x.id === c.memberId);
    const haberAcc = chargeHaberAccount(c);
    const esParcial = amount < restante - 0.01;
    const desc = c.concept + (esParcial ? ' (pago parcial)' : '') + ' — ' + (m ? m.name : '');
    const fecha = fechaISO ? isoToFecha(fechaISO) : todayStr();
    const entry = postEntry(desc, 'mp', haberAcc, amount, fecha);
    c.amountPaid = (c.amountPaid || 0) + amount;
    c.payments = c.payments || [];
    const comp = makeComprobante(chargeComprobanteTipo(c), c.memberId, c.concept + (esParcial ? ' (pago parcial de ' + fmt(amount) + ')' : ''), amount, entry.id, { fecha });
    c.payments.push({ id: uid('pg'), amount, date: fecha, entryId: entry.id, receiptId: comp.id });
    if (isFullyPaid(c)) { c.paid = true; c.paidDate = fecha; }
    save();
    openReceiptView(comp.id);
    showToast(esParcial ? 'Pago parcial registrado y comprobante generado.' : 'Pago registrado y comprobante generado.');
}

function revertChargePaymentEntry(chargeId, paymentId) {
    const c = db.charges.find(x => x.id === chargeId);
    if (!c) return;
    const pg = (c.payments || []).find(p => p.id === paymentId);
    if (!pg) return;
    if (!confirm('¿Revertir este pago de ' + fmt(pg.amount) + '? Se anulará el asiento y el comprobante (quedan guardados como anulados, no se borran).')) return;
    const entry = db.entries.find(x => x.id === pg.entryId);
    if (entry) entry.voided = true;
    const comp = db.comprobantes.find(x => x.id === pg.receiptId);
    if (comp) comp.voided = true;
    c.amountPaid = Math.max(0, (c.amountPaid || 0) - pg.amount);
    c.payments = c.payments.filter(p => p.id !== paymentId);
    c.paid = isFullyPaid(c) && c.amount > 0 ? c.paid : false;
    if (!isFullyPaid(c)) c.paid = false;
    save();
    openChargeModal(chargeId);
    showToast('Pago revertido.');
}

/* Tilde rápido para la grilla de cuotas: un toque marca pagado (por el saldo
   restante completo) y muestra el comprobante; un toque sobre algo ya pagado
   pregunta y revierte todo el cargo a pendiente. Para pagos parciales, usar
   la pestaña "Pendientes", que abre el detalle completo del cargo. */
function toggleCuotaCell(chargeId) {
    const c = db.charges.find(x => x.id === chargeId);
    if (!c) return;
    if (isFullyPaid(c)) {
        if (!confirm('¿Marcar como NO pagado? Se anulará el/los asiento(s) y comprobante(s) generados (quedan guardados como anulados, no se borran).')) return;
        (c.payments || []).slice().forEach(pg => {
            const entry = db.entries.find(x => x.id === pg.entryId);
            if (entry) entry.voided = true;
            const comp = db.comprobantes.find(x => x.id === pg.receiptId);
            if (comp) comp.voided = true;
        });
        c.payments = [];
        c.amountPaid = 0;
        c.paid = false;
        // Si era un pago adelantado de un mes que todavía no devengó, al
        // revertirlo se elimina el cargo (no debe quedar como deuda de un
        // mes que aún no pasó); se va a regenerar solo cuando el mes llegue.
        if (c.period && c.period > currentPeriod()) {
            db.charges = db.charges.filter(x => x.id !== c.id);
        }
        save();
        showToast('Pago revertido.');
    } else {
        registerChargePayment(chargeId, chargeRemaining(c));
    }
}

/* Permite registrar el pago adelantado de un mes que todavía no llegó (no
   devengado): genera el cargo de ese mes ya marcado como pagado, con el
   mismo circuito contable y de comprobante que un pago normal. El cargo no
   suma como deuda porque nace con saldo 0. */
function payCuotaAdvance(memberId, sourceType, period) {
    const member = db.members.find(x => x.id === memberId);
    if (!member) return;
    if (!confirm('¿Registrar el pago adelantado de ' + periodLabel(period) + '? Todavía no llegó ese mes; va a quedar marcado como pagado por adelantado.')) return;
    const amount = sourceType === 'cuota-normal' ? db.settings.cuotaNormalMonto : db.settings.cuotaBrasilMonto;
    const concept = (sourceType === 'cuota-normal' ? 'Cuota mensual ' : 'Cuota Brasil ') + periodLabel(period);
    const charge = {
        id: uid('ch'), sourceType, sourceId: null, memberId,
        period, concept, amount, amountPaid: 0, payments: [], paid: false, archived: false
    };
    db.charges.push(charge);
    registerChargePayment(charge.id, amount);
}

function openChargeModal(chargeId) {
    const c = db.charges.find(x => x.id === chargeId);
    if (!c) return;
    const m = db.members.find(x => x.id === c.memberId);
    const restante = chargeRemaining(c);
    const historyHtml = (c.payments || []).length ? (c.payments || []).map(pg => `
        <div class="row static">
            <div class="row-info">${fmt(pg.amount)}<br><small>${pg.date}</small></div>
            <button class="btn-ghost text-danger" onclick="revertChargePaymentEntry('${c.id}','${pg.id}')">Revertir</button>
        </div>`).join('') : '<div class="empty">Todavía no se registraron pagos.</div>';
    const html = `
        <h2>${escapeHtml(c.concept)}</h2>
        <div class="small muted mb0">${m ? escapeHtml(m.name) : ''}</div>
        <div class="card tight mt">
            <div class="row static"><span>Monto total</span><strong>${fmt(c.amount)}</strong></div>
            <div class="row static"><span>Pagado</span><strong class="text-success">${fmt(c.amountPaid || 0)}</strong></div>
            <div class="row static" style="border-bottom:none"><span>Pendiente</span><strong class="${restante > 0 ? 'text-danger' : 'text-success'}">${restante > 0 ? fmt(restante) : 'Al día'}</strong></div>
        </div>
        <h3 class="mt" style="font-size:0.85rem">Historial de pagos</h3>
        ${historyHtml}
        ${restante > 0 ? `
        <div class="field mt">
            <label>Registrar pago (podés poner menos si te dieron solo una parte)</label>
            <input id="pay-amount" type="number" value="${restante}" max="${restante}" min="0">
        </div>
        <div class="field">
            <label>Fecha del pago (podés poner una fecha anterior)</label>
            <input id="pay-date" type="date" value="${todayISO()}">
        </div>
        <button class="btn btn-accent" onclick="registerChargePayment('${c.id}', parseFloat(document.getElementById('pay-amount').value), document.getElementById('pay-date').value)">Registrar pago</button>
        ` : ''}
        <button class="btn btn-outline mt" onclick="closeModal()">Cerrar</button>
    `;
    openModalHTML(html);
}

/* ---------------------------------------------------------------------
   EVENTOS / PROYECTOS
   --------------------------------------------------------------------- */
function eventMembers(ev) {
    if (ev.scope === 'todos') return activeMembers();
    if (ev.scope === 'consejeros') return activeMembers().filter(m => m.cat === 'Consejero' || m.cat === 'Directivo');
    if (ev.scope === 'conquistadores') return activeMembers().filter(m => m.cat === 'Conquistador');
    if (ev.scope === 'unidad') return activeMembers().filter(m => m.unit && m.unit === ev.unitId);
    if (ev.scope === 'custom') return activeMembers().filter(m => (ev.memberIds || []).includes(m.id));
    return [];
}

/* Períodos (meses) en los que se cobra un evento mensual. Los eventos viejos
   no tienen la lista guardada: se deduce de los cargos que ya generaron. */
function eventPeriods(ev) {
    if (ev.periods && ev.periods.length) return ev.periods.slice().sort();
    const ps = new Set(db.charges.filter(c => c.sourceType === 'evento' && c.sourceId === ev.id && c.period).map(c => c.period));
    if (ps.size) return Array.from(ps).sort();
    if (ev.tipo === 'mensual') {
        const cur = currentPeriod();
        return Array.from({ length: ev.meses || 1 }, (_, i) => addMonths(cur, i));
    }
    return [];
}

function createEvent(data) {
    const id = uid('ev');
    const accId = 'ev-' + id;
    db.accounts.push({
        id: accId, name: 'Resultado — ' + data.name, type: 'ingreso', naturaleza: 'acreedora',
        desc: 'Cuenta de resultado neto (ingresos menos gastos) del proyecto/evento "' + data.name + '".',
        system: true, opening: 0, eventLinked: id
    });
    const periods = (data.periods || []).slice().sort();
    const ev = {
        id, name: data.name, desc: data.desc || '', scope: data.scope, memberIds: data.memberIds || [], unitId: data.unitId || null,
        tipo: data.tipo, meses: periods.length || data.meses || 1, periods, periodoUnico: data.periodoUnico || null,
        monto: data.monto || 0,
        accountResultId: accId, archived: false, createdAt: todayStr()
    };
    db.events.push(ev);
    if (ev.tipo !== 'general') generateEventCharges(ev);
    save();
    return ev;
}

function generateEventCharges(ev) {
    const members = eventMembers(ev);
    members.forEach(m => {
        if (ev.tipo === 'unico') {
            const ex = db.charges.find(c => c.sourceType === 'evento' && c.sourceId === ev.id && c.memberId === m.id);
            if (ex) { if (ex.archived) ex.archived = false; }
            else {
                const p = ev.periodoUnico || null;
                db.charges.push({ id: uid('ch'), sourceType: 'evento', sourceId: ev.id, memberId: m.id, period: p,
                    concept: ev.name + (p ? ' — ' + periodLabel(p) : ''), amount: ev.monto, amountPaid: 0, payments: [], paid: false, archived: false });
            }
        } else if (ev.tipo === 'mensual') {
            eventPeriods(ev).forEach(p => {
                const ex = db.charges.find(c => c.sourceType === 'evento' && c.sourceId === ev.id && c.memberId === m.id && c.period === p);
                if (ex) { if (ex.archived) ex.archived = false; }
                else {
                    db.charges.push({ id: uid('ch'), sourceType: 'evento', sourceId: ev.id, memberId: m.id, period: p,
                        concept: ev.name + ' — ' + periodLabel(p), amount: ev.monto, amountPaid: 0, payments: [], paid: false, archived: false });
                }
            });
        }
    });
}

function archiveEvent(id) {
    if (!confirm('¿Finalizar este proyecto? Se ocultará de la lista de activos pero nunca se borra: todo su historial y comprobantes quedan intactos.')) return;
    const ev = db.events.find(x => x.id === id);
    if (ev) ev.archived = true;
    closeModal();
    save();
}
function unarchiveEvent(id) {
    const ev = db.events.find(x => x.id === id);
    if (ev) ev.archived = false;
    save();
}

function eventProgress(ev) {
    const charges = db.charges.filter(c => c.sourceType === 'evento' && c.sourceId === ev.id && !c.archived);
    const total = charges.reduce((s, c) => s + c.amount, 0);
    const cobrado = charges.filter(c => c.paid).reduce((s, c) => s + c.amount, 0);
    const pagaron = new Set(charges.filter(c => c.paid).map(c => c.memberId)).size;
    const totalMiembros = new Set(charges.map(c => c.memberId)).size;
    return { total, cobrado, pagaron, totalMiembros, pct: total ? Math.round(cobrado / total * 100) : 0 };
}

function quickProjectEntry(eventId, kind) {
    const ev = db.events.find(x => x.id === eventId);
    if (!ev) return;
    openModalHTML(`
        <h2>${kind === 'ingreso' ? 'Nuevo ingreso' : 'Nuevo gasto'} — ${escapeHtml(ev.name)}</h2>
        <div class="field"><label>${kind === 'ingreso' ? 'Monto de la venta / ingreso' : 'Monto del gasto'}</label><input id="pe-monto" type="number" min="0"></div>
        <div class="field"><label>Descripción</label><input id="pe-desc" type="text" value="${escapeHtml(ev.name)}"></div>
        <div class="field"><label>Fecha</label><input id="pe-fecha" type="date" value="${todayISO()}"></div>
        <p class="small muted">Podés poner una fecha anterior para cargar movimientos viejos.</p>
        <button class="btn btn-accent" onclick="saveProjectEntry('${ev.id}','${kind}')">Registrar</button>
        <button class="btn btn-outline mt" onclick="openEventDetail('${ev.id}')">Volver</button>
    `);
}
function saveProjectEntry(eventId, kind) {
    const ev = db.events.find(x => x.id === eventId);
    if (!ev) return;
    const monto = parseFloat(byId('pe-monto').value);
    if (!monto || monto <= 0) { alert('Ingresá un monto válido.'); return; }
    const desc = byId('pe-desc').value.trim() || ev.name;
    const fecha = isoToFecha(byId('pe-fecha').value || todayISO());
    if (kind === 'ingreso') postEntry(desc, 'mp', ev.accountResultId, monto, fecha);
    else postEntry(desc, ev.accountResultId, 'mp', monto, fecha);
    closeModal();
    save();
    showToast(kind === 'ingreso' ? 'Ingreso registrado.' : 'Gasto registrado.');
}

function addAccount(name, type, naturaleza, desc, opening) {
    db.accounts.push({ id: uid('ac'), name, type, naturaleza, desc: desc || '', opening: opening || 0, system: false });
    save();
}
function updateAccount(id, patch) {
    const a = db.accounts.find(x => x.id === id);
    if (a) Object.assign(a, patch);
    save();
}
function accountInUse(id) {
    return db.entries.some(e => e.debe === id || e.haber === id) || db.events.some(e => e.accountResultId === id);
}
function deleteAccount(id) {
    const a = db.accounts.find(x => x.id === id);
    if (!a) return;
    if (a.system) { alert('Esta es una cuenta del sistema y no se puede eliminar. Podés editar su descripción.'); return; }
    if (accountInUse(id)) { alert('Esta cuenta tiene movimientos registrados, por lo tanto no se puede eliminar (para no perder el historial contable). Podés dejar de usarla simplemente no seleccionándola en nuevos asientos.'); return; }
    if (!confirm('¿Eliminar la cuenta "' + a.name + '"? Esta acción no se puede deshacer.')) return;
    db.accounts = db.accounts.filter(x => x.id !== id);
    closeModal();
    save();
    showToast('Cuenta eliminada.');
}

   --------------------------------------------------------------------- */
function balanceGeneral() {
    const activos = db.accounts.filter(a => a.type === 'activo');
    const pasivos = db.accounts.filter(a => a.type === 'pasivo');
    const patrimonios = db.accounts.filter(a => a.type === 'patrimonio');
    return {
        activos, pasivos, patrimonios,
        totalActivo: activos.reduce((s, a) => s + getBalance(a.id), 0),
        totalPasivo: pasivos.reduce((s, a) => s + getBalance(a.id), 0),
        totalPatrimonio: patrimonios.reduce((s, a) => s + getBalance(a.id), 0)
    };
}
function estadoResultados() {
    const ingresos = db.accounts.filter(a => a.type === 'ingreso');
    const gastos = db.accounts.filter(a => a.type === 'gasto');
    const totalIngresos = ingresos.reduce((s, a) => s + getBalance(a.id), 0);
    const totalGastos = gastos.reduce((s, a) => s + getBalance(a.id), 0);
    return { ingresos, gastos, totalIngresos, totalGastos, resultado: totalIngresos - totalGastos };
}

function adjustInventory(id, delta) {

/* ---------------------------------------------------------------------
   BACKUP / RESTORE
   --------------------------------------------------------------------- */
function exportBackup() {
    (async () => {
        const out = JSON.parse(JSON.stringify(db));
        out.__files = {};
        try {
            const grupos = [].concat(db.reintegros || [], db.entries || []);
            for (const r of grupos) {
                for (const id of (r.imgIds || [])) {
                    const u = await idbGet(id);
                    if (u) out.__files[id] = u;
                }
            }
        } catch (e) { console.warn('No se pudieron incluir las fotos en el respaldo', e); }
        const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
        downloadBlob(blob, clubSlug() + '_Backup_' + todayISO() + '.json');
        db.settings.lastBackup = Date.now();
        save();
    })();
}
function importBackupFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
        try {
            const incoming = JSON.parse(reader.result);
            if (!confirm('¿Reemplazar todos los datos actuales por los del archivo de respaldo? Esta acción no se puede deshacer.')) return;
            const files = incoming.__files || {};
            delete incoming.__files;
            db = deepMergeDefaults(incoming, defaultDB());
            try { for (const id of Object.keys(files)) await idbPut(id, files[id]); } catch (e) { console.warn(e); }
            save();
            closeModal();
            showToast('Respaldo importado correctamente.');
        } catch (e) {
            alert('El archivo no es un respaldo válido.');
        }
    };
    reader.readAsText(file);
}

/* ---------------------------------------------------------------------
   INSTALAR COMO APP (acceso directo / PWA)
   Nota clave: esto NO sincroniza datos entre dispositivos. Los datos viven
   en el almacenamiento local de cada navegador/dispositivo, se instale o no.
   --------------------------------------------------------------------- */
var deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
});

function setupManifest() {
    try {
        const manifest = {
            name: db.settings.clubName ? db.settings.clubName + ' — ASM Accounting' : 'ASM Accounting',
            short_name: 'ASM Accounting',
            start_url: './',
            display: 'standalone',
            background_color: '#14213D',
            theme_color: '#14213D',
            icons: [
                { src: LOGO_ICON, sizes: '512x512', type: 'image/png' },
                { src: LOGO_ICON, sizes: '192x192', type: 'image/png' }
            ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const url = URL.createObjectURL(blob);
        let link = document.querySelector('link[rel="manifest"]');
        if (!link) {
            link = document.createElement('link');
            link.rel = 'manifest';
            document.head.appendChild(link);
        }
        link.href = url;
    } catch (e) { console.warn('No se pudo preparar el manifest de instalación', e); }
}

function detectPlatform() {
    const ua = navigator.userAgent || '';
    if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
    if (/android/i.test(ua)) return 'android';
    return 'desktop';
}

async function installApp() {
    if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        try {
            const choice = await deferredInstallPrompt.userChoice;
            if (choice.outcome === 'accepted') showToast('¡Instalado! Ya tenés el ícono en tu pantalla de inicio.');
        } catch (e) { /* el usuario canceló */ }
        deferredInstallPrompt = null;
    } else {
        openInstallInstructionsModal();
    }
}

function openInstallInstructionsModal() {
    const platform = detectPlatform();
    let steps;
    if (platform === 'ios') {
        steps = `
            <ol style="padding-left:20px; line-height:1.9">
                <li>Tocá el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba) abajo en Safari.</li>
                <li>Elegí <b>"Agregar a pantalla de inicio"</b> (puede estar más abajo en la lista).</li>
                <li>Confirmá el nombre y tocá <b>Agregar</b>.</li>
            </ol>`;
    } else if (platform === 'android') {
        steps = `
            <ol style="padding-left:20px; line-height:1.9">
                <li>Tocá el menú <b>⋮</b> (arriba a la derecha de Chrome).</li>
                <li>Elegí <b>"Agregar a pantalla de inicio"</b> o <b>"Instalar app"</b> si aparece.</li>
                <li>Confirmá tocando <b>Agregar</b> / <b>Instalar</b>.</li>
            </ol>`;
    } else {
        steps = `
            <ol style="padding-left:20px; line-height:1.9">
                <li>Buscá el ícono de instalar (una pantalla con una flecha, o un ⊕) en la barra de direcciones del navegador.</li>
                <li>O abrí el menú del navegador y elegí <b>"Instalar ASM Accounting..."</b>.</li>
            </ol>`;
    }
    const html = `
        <h2>Instalar en la pantalla de inicio</h2>
        ${steps}
        <p class="small muted mt"><b>Importante:</b> esto crea un acceso directo con el ícono del club para abrir la app más rápido y sin las barras del navegador, pero <b>no sincroniza los datos entre dispositivos</b>. Cada celular o computadora sigue guardando su propia información por separado. Para pasar los datos de uno a otro, usá "Exportar respaldo" en uno e "Importar respaldo" en el otro.</p>
        <button class="btn btn-outline mt" onclick="closeModal()">Entendido</button>
    `;
    openModalHTML(html);
}

function saveUnit(id) {
    const name = byId('un-name').value.trim();
    if (!name) { alert('El nombre de la unidad es obligatorio.'); return; }
    if (db.units.some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())) { alert('Ya existe una unidad con ese nombre.'); return; }
    let unitId = id;
    if (id) {
        db.units.find(x => x.id === id).name = name;
    } else {
        unitId = uid('un');
        db.units.push({ id: unitId, name });
    }
    const checked = new Set(Array.from(document.querySelectorAll('.unit-chk:checked')).map(x => x.value));
    db.members.forEach(m => {
        if (checked.has(m.id)) m.unit = unitId;
        else if (m.unit === unitId) m.unit = null;
    });
    save();
    showToast('Unidad guardada.');
    openUnitsModal();
}
function deleteUnit(id) {
    const u = db.units.find(x => x.id === id);
    if (!u) return;
    if (!confirm('¿Eliminar la unidad "' + u.name + '"? Sus miembros quedan sin unidad (no se borra a nadie).')) return;

    showToast('Unidad eliminada.');

}

            ${m.brasil ? `<div class="row static"><span>Cuota Brasil</span><strong class="${debtBrasil > 0 ? 'text-danger' : 'text-success'}">${debtBrasil > 0 ? fmt(debtBrasil) : 'Al día'}</strong></div>` : ''}

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderEventTipoFields() {

        <div class="field">

            <select id="ev-scope" onchange="renderEventScopeFields()">
                <option value="todos" ${ev && ev.scope === 'todos' ? 'selected' : ''}>Todos los miembros</option>

        </div>`;
        } else {
            html += `
        <div class="field">
            <label>Mes de referencia (opcional)</label>
            <input id="ev-periodo-unico" type="month" value="${ev && ev.periodoUnico ? ev.periodoUnico : ''}">

        }

function renderEventMonthChips() {
    const d = byId('ev-desde').value, h = byId('ev-hasta').value;
    const box = byId('ev-chips');
    if (!d || !h || d > h) {
        box.innerHTML = '<small class="muted">Elegí un rango válido (desde ≤ hasta).</small>';
        byId('ev-chips-count').textContent = '';
        return;
    }
    const ps = periodRange(d, h).slice(0, 36);
    box.innerHTML = ps.map(p => `<label class="pchip"><input type="checkbox" class="ev-per-chk" value="${p}" ${evOff.has(p) ? '' : 'checked'} onchange="toggleEvPeriod('${p}', this.checked)"> ${periodLabel(p)}</label>`).join('');
    updateEvChipsCount();
}
function toggleEvPeriod(p, on) { if (on) evOff.delete(p); else evOff.add(p); updateEvChipsCount(); }
function updateEvChipsCount() {
    const n = document.querySelectorAll('.ev-per-chk:checked').length;
    byId('ev-chips-count').textContent = n + ' cuota(s) mensual(es) seleccionada(s).';
}
function renderEventScopeFields() {
    const ev = evEditing;
    const scope = byId('ev-scope').value;
    const box = byId('ev-scope-fields');
    if (scope === 'custom') {
        box.innerHTML = `<div class="field"><label>Miembros incluidos</label><div class="member-pick">${byId('ev-member-cache').innerHTML}</div></div>`;
    } else if (scope === 'unidad') {
        const opts = unitsList().map(u => `<option value="${u.id}" ${ev && ev.unitId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('');
        box.innerHTML = unitsList().length
