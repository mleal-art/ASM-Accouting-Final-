            : '<p class="small muted">Todavía no creaste unidades (Miembros → Unidades).</p>';
    } else {
        box.innerHTML = '';
    }
}
function saveEvent(editId) {
    const name = byId('ev-name').value.trim();
    if (!name) { alert('El nombre es obligatorio.'); return; }
    const desc = byId('ev-desc').value.trim();
    const tipo = byId('ev-tipo').value;
    let scope = 'todos', memberIds = [], monto = 0, periods = [], periodoUnico = null, unitId = null;
    if (tipo !== 'general') {
        scope = byId('ev-scope').value;
        monto = parseFloat(byId('ev-monto').value) || 0;
        if (tipo === 'mensual') {
            periods = Array.from(document.querySelectorAll('.ev-per-chk:checked')).map(x => x.value);
            if (!periods.length) { alert('Elegí al menos un mes para cobrar.'); return; }
        } else {
            periodoUnico = byId('ev-periodo-unico').value || null;
        }
        if (scope === 'custom') {
            memberIds = Array.from(document.querySelectorAll('.ev-member-chk:checked')).map(x => x.value);
            if (!memberIds.length) { alert('Elegí al menos un miembro.'); return; }
        }
        if (scope === 'unidad') {
            const us = byId('ev-unit');
            unitId = us ? us.value : null;
            if (!unitId) { alert('Elegí una unidad.'); return; }
        }
    }
    if (editId) {
        const ev = db.events.find(x => x.id === editId);
        ev.name = name; ev.desc = desc; ev.scope = scope; ev.memberIds = memberIds; ev.unitId = unitId; ev.monto = monto;
        if (tipo === 'mensual') { ev.periods = periods.slice().sort(); ev.meses = periods.length; }
        if (tipo === 'unico') ev.periodoUnico = periodoUnico;
        if (ev.tipo !== 'general') {
            const inScope = new Set(eventMembers(ev).map(m => m.id));
            const perSet = new Set(ev.tipo === 'mensual' ? eventPeriods(ev) : []);
            db.charges.filter(c => c.sourceType === 'evento' && c.sourceId === ev.id).forEach(c => {
                const keep = inScope.has(c.memberId) && (ev.tipo !== 'mensual' || perSet.has(c.period));
                if (!keep && !c.amountPaid) c.archived = true;
                if (keep && !c.paid) c.amount = monto;
            });
            generateEventCharges(ev);
        }
        save();
        closeModal();
        showToast('Proyecto actualizado.');
    } else {
        createEvent({ name, desc, tipo, scope, memberIds, unitId, monto, periods, periodoUnico });
        closeModal();
        showToast('Proyecto creado.');
    }
}

function openEventDetail(id) {
    const ev = db.events.find(x => x.id === id);
    if (!ev) return;
    let body = '';
    if (ev.tipo === 'general') {
        const saldo = getBalance(ev.accountResultId);
        body = `
            <div class="card tight" style="text-align:center">
                <label style="font-size:0.62rem; font-weight:700; color:var(--muted); text-transform:uppercase">Resultado acumulado</label>
                <div style="font-family:'Bricolage Grotesque',-apple-system,'Segoe UI',sans-serif; font-size:1.3rem; font-weight:700; color:${saldo >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmt(saldo)}</div>
            </div>
            <div class="btn-row mt">
                <button class="btn btn-success btn-sm" onclick="quickProjectEntry('${ev.id}','ingreso')">+ Ingreso</button>
                <button class="btn btn-outline danger btn-sm" onclick="quickProjectEntry('${ev.id}','gasto')">+ Gasto</button>
            </div>
        `;
    } else {
        const prog = eventProgress(ev);
        const charges = db.charges.filter(c => c.sourceType === 'evento' && c.sourceId === ev.id && !c.archived);
        const byMember = {};
        charges.forEach(c => { (byMember[c.memberId] = byMember[c.memberId] || []).push(c); });
        const rows = Object.keys(byMember).map(mid => {
            const m = db.members.find(x => x.id === mid);
            if (!m) return '';
            return byMember[mid].map(c => {
                let chip;
                if (isFullyPaid(c)) chip = `<span class="chip paid" onclick="openChargeModal('${c.id}')">Pagó ✓</span>`;
                else if (c.amountPaid > 0) chip = `<span class="chip unpaid" onclick="openChargeModal('${c.id}')">Parcial: falta ${fmt(chargeRemaining(c))}</span>`;
                else chip = `<span class="chip unpaid" onclick="openChargeModal('${c.id}')">Debe ${fmt(c.amount)}</span>`;
                return `<div class="row static">
                    <div class="row-info"><b>${escapeHtml(m.name)}</b><br><small>${escapeHtml(c.concept)} · ${fmt(c.amount)}</small></div>
                    ${chip}
                </div>`;
            }).join('');
        }).join('');
        body = `
            <div class="small muted">${prog.pagaron} / ${prog.totalMiembros} miembros pagaron — ${fmt(prog.cobrado)} de ${fmt(prog.total)}</div>
            <div class="progress-bar"><div style="width:${prog.pct}%"></div></div>
            <div class="mt">${rows || '<p class="empty">Sin cargos generados.</p>'}</div>
        `;
    }
    const html = `
        <h2>${escapeHtml(ev.name)}</h2>
        ${ev.desc ? `<p class="small muted">${escapeHtml(ev.desc)}</p>` : ''}
        ${body}
        <button class="btn btn-accent mt" onclick="openEventModal('${ev.id}')">Editar proyecto</button>
        ${ev.archived
            ? `<button class="btn btn-outline mt" onclick="unarchiveEvent('${ev.id}'); closeModal();">Reactivar proyecto</button>`
            : `<button class="btn btn-outline danger mt" onclick="archiveEvent('${ev.id}')">Finalizar proyecto</button>`}
        <button class="btn btn-outline danger mt" onclick="deleteEvent('${ev.id}')">Eliminar proyecto</button>
        <button class="btn btn-outline mt" onclick="closeModal()">Cerrar</button>
    `;
    openModalHTML(html);
}

function renderEnThumbs() {

        <button type="button" onclick="enRemoveImg('${im.id}')">×</button></div>`).join('') : '<small class="muted">Sin fotos.</small>';

async function enAddFiles(input) {
    for (const f of Array.from(input.files || [])) {
        try { enDraft.imgs.push({ id: uid('img'), url: await resizeImage(f), isNew: true }); }
        catch (e) { showToast('No se pudo leer una de las imágenes.'); }
    }
    input.value = '';
    renderEnThumbs();
}
function enRemoveImg(id) {
    const im = enDraft.imgs.find(x => x.id === id);
    if (!im) return;
    if (!im.isNew) enDraft.removed.push(id);
    enDraft.imgs = enDraft.imgs.filter(x => x.id !== id);
    renderEnThumbs();
}
async function enPersistImgs() {
    for (const im of enDraft.imgs) if (im.isNew) { await idbPut(im.id, im.url); imgCache.set(im.id, im.url); }
    for (const id of enDraft.removed) { await idbDel(id); imgCache.delete(id); }
    return enDraft.imgs.map(i => i.id);
}
async function saveManualEntry(editId) {
    const desc = byId('en-desc').value.trim() || 'Asiento manual';
    const debe = byId('en-debe').value;
    const haber = byId('en-haber').value;
    const monto = parseFloat(byId('en-monto').value);
    const fechaISO = byId('en-fecha').value || todayISO();
    if (!monto || monto <= 0) { alert('Ingresá un monto válido.'); return; }
    if (debe === haber) { alert('La cuenta Debe y Haber no pueden ser la misma.'); return; }
    let imgIds;
    try { imgIds = await enPersistImgs(); }
    catch (e) { alert('No se pudieron guardar las fotos en este navegador (' + e.message + ').'); return; }
    if (editId) {
        const entry = db.entries.find(x => x.id === editId);
        if (!entry) { closeModal(); return; }
        entry.imgIds = imgIds;
        entry.desc = desc; entry.debe = debe; entry.haber = haber; entry.monto = Math.round(monto); entry.fecha = isoToFecha(fechaISO);
        closeModal();
        save();
        showToast('Asiento actualizado.');
        return;
    }
    const fecha = isoToFecha(fechaISO);
    const entry = postEntry(desc, debe, haber, monto, fecha);
    entry.imgIds = imgIds;
    const esReintegro = byId('en-reintegro').checked;
    let comp = null;
    if (esReintegro) {
        const memberId = byId('en-member').value || null;
        comp = makeComprobante('reintegro', memberId, desc, monto, entry.id, { fecha });

    closeModal();
    save();
    if (comp) { openReceiptView(comp.id); showToast('Asiento y comprobante de reintegro generados.'); }
    else showToast('Asiento registrado.');
}

const MESES_FULL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
/* Nombre del archivo: "Nahuel Lopez octubre brasil.pdf" (persona + mes + tipo) */
function receiptFileName(c) {
    const ch = db.charges.find(x => (x.payments || []).some(p => p.receiptId === c.id));
    let mes = '';
    if (ch && ch.period) {
        const m = parseInt(ch.period.split('-')[1], 10);
        mes = m === 0 ? 'inscripción' : (MESES_FULL[m - 1] || '');
    }
    if (!mes && c.tipo !== 'libre') {
        const iso = fechaToISO(c.fecha) || todayISO();
        mes = MESES_FULL[parseInt(iso.slice(5, 7), 10) - 1] || '';
    }
    let tipo = { 'cuota-normal': 'cuota', 'cuota-brasil': 'brasil', 'reintegro': 'reintegro' }[c.tipo] || 'comprobante';
    if (c.tipo === 'evento') { const ev = ch && db.events.find(e => e.id === ch.sourceId); tipo = ev ? ev.name : 'evento'; }
    if (c.tipo === 'reintegro' && c.titulo && !/^comprobante de reintegro$/i.test(c.titulo)) tipo = c.titulo;
    if (c.tipo === 'libre') tipo = c.concepto.slice(0, 40);
    const nombre = c.memberName && c.memberName !== '—' ? c.memberName : '';
    const base = [nombre, mes, tipo].filter(Boolean).join(' ').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ').trim();
    return (base || 'Comprobante ' + c.numero) + '.pdf';
}
function downloadReceiptPDF(compId) {
    const c = db.comprobantes.find(x => x.id === compId);
    buildReceiptPDF(compId).save(receiptFileName(c));
}
async function shareReceipt(compId) {
    const c = db.comprobantes.find(x => x.id === compId);
    const doc = buildReceiptPDF(compId);
    const text = receiptFullTitle(c) + ' (N.º ' + c.numero + ') — ' + c.concepto + ' — ' + fmt(c.monto);
    const shareTitle = 'Comprobante ' + db.settings.clubName;
    try {
        const blob = doc.output('blob');
        const file = new File([blob], receiptFileName(c), { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: shareTitle, text });
            return;
        }
    } catch (e) { /* sigue a los métodos alternativos */ }
    if (navigator.share) {
        try { await navigator.share({ title: shareTitle, text }); return; } catch (e) { /* cancelado */ }
    }
    downloadReceiptPDF(compId);
    showToast('Se descargó el PDF para compartirlo manualmente.');
}

function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
}
async function shareOrDownloadBlob(blob, filename, mime, shareTitle) {
    try {
        const file = new File([blob], filename, { type: mime });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: shareTitle || filename });
            return;
        }
    } catch (e) { /* sigue al método de descarga */ }
    downloadBlob(blob, filename);
    showToast('Se descargó el archivo para compartirlo manualmente.');
}

/* Introducción automática: un breve resumen de qué contiene el informe */
function pdfIntro(doc, y, text) {
    doc.setFontSize(9);
    const lines = doc.splitTextToSize(text, 162);
    const h = lines.length * 4.4 + 9;
    y = pdfEnsure(doc, y, h + 4);
    doc.setFillColor(244, 246, 250);
    doc.setDrawColor(228, 233, 240);
    doc.roundedRect(20, y, 170, h, 2, 2, 'FD');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(168, 136, 65);
    doc.text('INTRODUCCIÓN', 24, y + 5.5);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(50, 60, 75);
    doc.text(lines, 24, y + 11);
    doc.setTextColor(0, 0, 0);
    return y + h + 8;
}
function pdfEnsure(doc, y, need) {
    if (y + need > 276) { doc.addPage(); return 20; }
    return y;
}
function pdfHeading(doc, y, text) {
    y = pdfEnsure(doc, y, 30);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.setTextColor(20, 33, 61);
    doc.text(text, 20, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(0, 0, 0);
    return y + 4;
}
function pdfTable(doc, y, head, body, extra) {
    doc.autoTable(Object.assign({
        startY: y,
        head: [head],
        body,
        theme: 'striped',
        headStyles: { fillColor: [20, 33, 61], textColor: 255 },
        footStyles: { fillColor: [232, 236, 244], textColor: [20, 33, 61], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 2.2 },
        margin: { left: 20, right: 20 }
    }, extra || {}));
    return doc.lastAutoTable.finalY + 10;
}
function pdfChart(doc, y, chart, mmWidth) {
    if (!chart) return y;
    const w = mmWidth || 150;
    const h = w * chart.h / chart.w;
    y = pdfEnsure(doc, y, h + 4);
    doc.addImage(chart.url, 'PNG', 20 + (170 - w) / 2, y, w, h);
    return y + h + 8;
}
function pdfText(doc, y, text, size, color) {
    doc.setFontSize(size || 9);
    doc.setTextColor.apply(doc, color || [60, 70, 85]);
    const lines = doc.splitTextToSize(text, 170);
    y = pdfEnsure(doc, y, lines.length * 4.5 + 2);
    doc.text(lines, 20, y);
    doc.setTextColor(0, 0, 0);
    return y + lines.length * 4.5 + 3;
}
/* Firma del tesorero al final + numeración de páginas */
function pdfFinish(doc, y, filename) {
    const tes = tesoreroName();
    if (tes) {
        y = pdfEnsure(doc, y, 36);
        y += 16;
        doc.setDrawColor(90, 90, 90);
        doc.line(130, y, 190, y);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(20, 33, 61);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(110, 110, 110);
        doc.text(db.settings.clubName, 160, y + 11, { align: 'center' });
    }
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
        doc.setPage(i);
        doc.setFontSize(8);
        doc.setTextColor(130, 130, 130);
        doc.text(db.settings.clubName + (tes ? ' · Tesorero: ' + tes : ''), 20, 290);

    }
    doc.setTextColor(0, 0, 0);
    return { blob: doc.output('blob'), filename };

/* ---- Gráficos (se dibujan en un canvas y se insertan como imagen) ---- */
function chartNew(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w, h);
    return { c, g };
}
function shortNum(n) {
    const a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + ' M';
    if (a >= 1e3) return Math.round(n / 1e3) + ' k';
    return String(Math.round(n));
}
function ellipsize(g, text, maxW) {
    text = String(text);
    if (g.measureText(text).width <= maxW) return text;
    while (text.length > 1 && g.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
}
/* Gráfico de torta (dona) con porcentajes y leyenda */
function chartPie(items, o) {
    o = o || {};
    items = items.filter(i => i.val > 0).sort((a, b) => b.val - a.val);
    if (!items.length) return null;
    if (items.length > 8) {
        const rest = items.slice(7).reduce((s, i) => s + i.val, 0);
        items = items.slice(0, 7).concat([{ name: 'Otros', val: rest }]);
    }
    const total = items.reduce((s, i) => s + i.val, 0);
    const W = 1000, H = 520;
    const { c, g } = chartNew(W, H);
    const cx = 260, cy = o.title ? 300 : 270, R = 195, r = 105;
    if (o.title) { g.fillStyle = '#14213D'; g.font = 'bold 30px sans-serif'; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillText(o.title, 30, 46); }
    let a0 = -Math.PI / 2;
    items.forEach((it, i) => {
        const frac = it.val / total;
        const a1 = a0 + frac * 2 * Math.PI;
        g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a0, a1); g.closePath();
        g.fillStyle = it.color || CHART_COLORS[i % CHART_COLORS.length]; g.fill();
        g.lineWidth = 4; g.strokeStyle = '#ffffff'; g.stroke();
        if (frac >= 0.06) {
            const am = (a0 + a1) / 2, rr = (R + r) / 2;
            g.fillStyle = '#ffffff'; g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText((frac * 100).toFixed(frac * 100 >= 10 ? 0 : 1).replace('.', ',') + '%', cx + Math.cos(am) * rr, cy + Math.sin(am) * rr);
        }
        a0 = a1;
    });
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#6B7A90'; g.font = '20px sans-serif';
    g.fillText(o.centerLabel || 'Total', cx, cy - 16);
    g.fillStyle = '#14213D'; g.font = 'bold 22px sans-serif';
    g.fillText(o.centerValue || arsStr(total), cx, cy + 16);
    // leyenda
    let y = o.title ? 110 : 80;
    g.textAlign = 'left';
    items.forEach((it, i) => {
        g.fillStyle = it.color || CHART_COLORS[i % CHART_COLORS.length];
        g.fillRect(520, y, 28, 28);
        g.textBaseline = 'alphabetic';
        g.fillStyle = '#1B2431'; g.font = 'bold 22px sans-serif';
        g.fillText(ellipsize(g, it.name, 420), 562, y + 14);
        g.fillStyle = '#6B7A90'; g.font = '19px sans-serif';
        g.fillText((it.val / total * 100).toFixed(1).replace('.', ',') + '%  ·  ' + arsStr(it.val), 562, y + 38);
        y += 54;
    });
    return { url: c.toDataURL('image/png'), w: W, h: H };
}
/* Gráfico de barras agrupadas (ej. ingresos y gastos por mes) */
function chartBars(labels, series, o) {
    o = o || {};
    if (!labels.length) return null;
    const W = 1000, H = 520;
    const { c, g } = chartNew(W, H);
    const L = 100, Rm = 30, T = o.title ? 130 : 90, B = 90;
    const pw = W - L - Rm, ph = H - T - B;
    let max = 1;
    series.forEach(s => s.values.forEach(v => { if (v > max) max = v; }));
    const rough = max / 4, mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    const niceMax = Math.ceil(max / step) * step;
    if (o.title) { g.fillStyle = '#14213D'; g.font = 'bold 30px sans-serif'; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillText(o.title, 30, 46); }
    // leyenda
    let lx = 30;
    const ly = o.title ? 86 : 40;
    series.forEach(s => {
        g.fillStyle = s.color; g.fillRect(lx, ly - 18, 24, 24);
        g.fillStyle = '#1B2431'; g.font = '21px sans-serif'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
        g.fillText(s.name, lx + 34, ly + 1);
        lx += 34 + g.measureText(s.name).width + 36;
    });
    // grilla
    g.font = '17px sans-serif'; g.textAlign = 'right'; g.textBaseline = 'middle';
    for (let v = 0; v <= niceMax + 1e-6; v += step) {
        const y = T + ph - (v / niceMax) * ph;
        g.strokeStyle = v === 0 ? '#9AA6B8' : '#E4E9F0'; g.lineWidth = v === 0 ? 2 : 1;
        g.beginPath(); g.moveTo(L, y); g.lineTo(W - Rm, y); g.stroke();
        g.fillStyle = '#6B7A90';
        g.fillText(shortNum(v), L - 10, y);
    }
    const n = labels.length, gw = pw / n, inner = gw * 0.74, bw = inner / series.length;
    labels.forEach((lab, i) => {
        const gx = L + i * gw + (gw - inner) / 2;
        series.forEach((s, j) => {
            const v = s.values[i] || 0;
            const bh = (v / niceMax) * ph;
            g.fillStyle = s.color;
            g.fillRect(gx + j * bw, T + ph - bh, bw - 3, bh);
            if (n <= 8 && v > 0) {
                g.fillStyle = '#1B2431'; g.font = '16px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
                g.fillText(shortNum(v), gx + j * bw + (bw - 3) / 2, T + ph - bh - 6);
            }
        });
        g.fillStyle = '#4B5A70'; g.font = (n > 10 ? 15 : 18) + 'px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
        g.fillText(lab, L + i * gw + gw / 2, T + ph + 30);
    });
    return { url: c.toDataURL('image/png'), w: W, h: H };
}

/* ---- Flujo mensual a partir de los asientos (respeta fechas históricas) ---- */
function monthlyFlows() {
    const acc = {};
    db.accounts.forEach(a => { acc[a.id] = a; });
    const out = {};
    db.entries.forEach(e => {
        if (e.voided) return;
        const p = fechaPeriod(e.fecha);
        if (!p) return;
        const d = acc[e.debe], h = acc[e.haber];
        const o = out[p] = out[p] || { ing: 0, gas: 0 };
        if (h && h.type === 'ingreso') o.ing += e.monto;
        if (h && h.type === 'gasto') o.gas -= e.monto;
        if (d && d.type === 'gasto') o.gas += e.monto;
        if (d && d.type === 'ingreso') o.gas += e.monto;
    });
    return out;
}
function monthlySeries(lastN) {
    const flows = monthlyFlows();
    let ps = Object.keys(flows).sort();
    if (!ps.length) return { periods: [], ing: [], gas: [] };
    ps = periodRange(ps[0], ps[ps.length - 1]);
    if (lastN) ps = ps.slice(-lastN);
    return {
        periods: ps,
        ing: ps.map(p => (flows[p] ? flows[p].ing : 0)),
        gas: ps.map(p => (flows[p] ? flows[p].gas : 0))
    };
}
/* Ingresos y gastos por área. Una cuenta de evento con resultado negativo
   (más gastos que ingresos) se muestra como gasto, para que los gráficos de
   torta no pierdan información. El resultado neto no cambia. */
function areaTotals() {
    const er = estadoResultados();
    const ing = [], gas = [];
    er.ingresos.forEach(a => { const v = getBalance(a.id); if (v > 0) ing.push({ name: a.name, val: v }); else if (v < 0) gas.push({ name: a.name, val: -v }); });
    er.gastos.forEach(a => { const v = getBalance(a.id); if (v > 0) gas.push({ name: a.name, val: v }); else if (v < 0) ing.push({ name: a.name, val: -v }); });
    return { er, ing, gas };
}
function resumenCuotasGlobal() {
    const ch = db.charges.filter(c => !c.archived && c.sourceType !== 'evento');
    const total = ch.reduce((s, c) => s + c.amount, 0);
    const cobrado = ch.reduce((s, c) => s + Math.min(c.amountPaid || 0, c.amount), 0);
    return { total, cobrado, pendiente: Math.max(0, total - cobrado) };
}

/* ---- Informe de cuotas (mensual y Brasil): cobrado, pendiente y porcentajes ---- */
function cuotaStats(sourceType, year) {
    const ys = String(year);
    const charges = db.charges.filter(c => !c.archived && c.sourceType === sourceType && c.period && c.period.slice(0, 4) === ys);
    const byP = {};
    charges.forEach(c => {
        const b = byP[c.period] = byP[c.period] || { period: c.period, n: 0, nPaid: 0, total: 0, paid: 0 };
        b.n++; if (isFullyPaid(c)) b.nPaid++;
        b.total += c.amount; b.paid += Math.min(c.amountPaid || 0, c.amount);
    });
    const periods = Object.values(byP).sort((a, b) => a.period.localeCompare(b.period));
    const byM = {};
    charges.forEach(c => {
        const b = byM[c.memberId] = byM[c.memberId] || { memberId: c.memberId, total: 0, paid: 0 };
        b.total += c.amount; b.paid += Math.min(c.amountPaid || 0, c.amount);
    });
    const members = Object.values(byM).map(x => {
        const m = db.members.find(y => y.id === x.memberId);
        return Object.assign(x, { name: m ? m.name : '(miembro eliminado)', unit: m && m.unit ? unitName(m.unit) : '' });
    });
    const byU = {};
    members.forEach(mm => {
        const k = mm.unit || 'Sin unidad';
        const b = byU[k] = byU[k] || { name: k, total: 0, paid: 0, n: 0 };
        b.total += mm.total; b.paid += mm.paid; b.n++;
    });
    const total = periods.reduce((s, p) => s + p.total, 0);
    const paid = periods.reduce((s, p) => s + p.paid, 0);
    return { periods, members, units: Object.values(byU), total, paid, pend: Math.max(0, total - paid) };
}
function buildCuotasPDFBlob(sourceType, year) {
    const esBrasil = sourceType === 'cuota-brasil';
    const titulo = esBrasil ? 'Informe cuota campori Brasil ' + year : 'Informe de cuotas mensuales ' + year;
    const st = cuotaStats(sourceType, year);
    const { doc, y: y0 } = pdfStart(titulo);
    const mesIni = esBrasil ? cfgBrasilIni() : cfgNormalIni(), mesFin = esBrasil ? cfgBrasilFin() : cfgNormalFin();
    let y = pdfIntro(doc, y0,
        'Este informe resume el estado de ' + (esBrasil ? 'la cuota del campori de Brasil' : 'las cuotas mensuales') + ' del año ' + year + ' de ' + db.settings.clubName + ' (período configurado: ' + MESES[mesIni - 1] + ' a ' + MESES[mesFin - 1] + '). Muestra, mes por mes, cuánto se esperaba cobrar, cuánto se cobró y cuánto está pendiente, con sus porcentajes, gráficos de torta y de barras, y el detalle por miembro' + (db.units.length ? ' y por unidad' : '') + '. ' +
        (st.total > 0
            ? 'A la fecha se cobró ' + arsStr(st.paid) + ' de ' + arsStr(st.total) + ' (' + pctStr(st.paid, st.total) + ') y queda pendiente ' + arsStr(st.pend) + ' (' + pctStr(st.pend, st.total) + ').'
            : 'Todavía no hay cuotas generadas para este año.'));
    if (st.total <= 0) {
        return pdfFinish(doc, y, (esBrasil ? 'Cuota_Brasil_' : 'Cuotas_Mensuales_') + year + '.pdf');
    }
    y = pdfHeading(doc, y, 'Detalle por mes');
    y = pdfTable(doc, y, ['Mes', 'Cargos', 'Pagaron', 'Esperado', 'Cobrado', '% cobrado', 'Pendiente', '% pend.'],
        st.periods.map(p => [periodLabel(p.period).replace(' ' + year, ''), p.n, p.nPaid, arsStr(p.total), arsStr(p.paid), pctStr(p.paid, p.total), arsStr(p.total - p.paid), pctStr(p.total - p.paid, p.total)]),
        { foot: [['TOTAL', st.periods.reduce((s, p) => s + p.n, 0), st.periods.reduce((s, p) => s + p.nPaid, 0), arsStr(st.total), arsStr(st.paid), pctStr(st.paid, st.total), arsStr(st.pend), pctStr(st.pend, st.total)]], showFoot: 'lastPage',
          styles: { fontSize: 8.5, cellPadding: 2 } });

    y = pdfChart(doc, y, chartPie([
        { name: 'Cobrado', val: st.paid, color: '#0F9D6E' }, { name: 'Pendiente', val: st.pend, color: '#F59E0B' }
    ], { title: 'Cobrado vs pendiente (total del año)', centerLabel: 'Esperado', centerValue: arsStr(st.total) }), 135);
    y = pdfChart(doc, y, chartBars(st.periods.map(p => shortPeriodLabel(p.period)), [
        { name: 'Cobrado', color: '#0F9D6E', values: st.periods.map(p => p.paid) },
        { name: 'Pendiente', color: '#F59E0B', values: st.periods.map(p => p.total - p.paid) }
    ], { title: 'Cobrado y pendiente por mes' }), 160);

    if (st.units.length > 1 || (st.units.length === 1 && st.units[0].name !== 'Sin unidad')) {
        y = pdfHeading(doc, y, 'Detalle por unidad');
        const us = st.units.sort((a, b) => b.paid / (b.total || 1) - a.paid / (a.total || 1));
        y = pdfTable(doc, y, ['Unidad', 'Miembros', 'Esperado', 'Cobrado', '% cobrado', 'Pendiente'],
            us.map(u => [u.name, u.n, arsStr(u.total), arsStr(u.paid), pctStr(u.paid, u.total), arsStr(u.total - u.paid)]));
        y = pdfChart(doc, y, chartPie(us.map(u => ({ name: u.name, val: u.paid })), { title: 'Cobrado por unidad', centerLabel: 'Cobrado' }), 135);
    }

    y = pdfHeading(doc, y, 'Detalle por miembro');
    const ms = st.members.sort((a, b) => (b.total - b.paid) - (a.total - a.paid) || a.name.localeCompare(b.name, 'es'));
    y = pdfTable(doc, y, ['Miembro', 'Unidad', 'Esperado', 'Cobrado', '% cobrado', 'Pendiente'],
        ms.map(m => [m.name, m.unit || '—', arsStr(m.total), arsStr(m.paid), pctStr(m.paid, m.total), arsStr(m.total - m.paid)]));

    return pdfFinish(doc, y, (esBrasil ? 'Cuota_Brasil_' : 'Cuotas_Mensuales_') + year + '_' + todayISO() + '.pdf');
}

function runReport(id) {
    const r = REPORTES.find(x => x.id === id);
    if (!r) return;
    if (r.year) { openReportYearModal(id); return; }
    generateReport(r, null);
}
function generateReport(r, year) {
    try {
        const { blob, filename } = r.build(year);
        const mime = filename.endsWith('.xlsx') ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/pdf';
        openReportResultModal(r.label, blob, filename, mime);
    } catch (e) {
        console.error(e);
        alert('No se pudo generar el informe: ' + e.message);
    }
}
function openReportYearModal(id) {
    const r = REPORTES.find(x => x.id === id);
    const cur = new Date().getFullYear();
    const ys = new Set([cur]);
    db.charges.forEach(c => { if (c.period) ys.add(parseInt(c.period.slice(0, 4), 10)); });
    const opts = Array.from(ys).sort((a, b) => b - a).map(y => `<option value="${y}" ${y === cur ? 'selected' : ''}>${y}</option>`).join('');
    openModalHTML(`
        <h2>${escapeHtml(r.label)}</h2>
        <div class="field"><label>Año del informe</label><select id="rep-year">${opts}</select></div>
        <button class="btn btn-accent" onclick="runReportYear('${id}')">Generar informe</button>
        <button class="btn btn-outline mt" onclick="closeModal()">Cancelar</button>
    `);
}
function runReportYear(id) {
    const r = REPORTES.find(x => x.id === id);
    const year = parseInt(byId('rep-year').value, 10);
    generateReport(r, year);
}

function renderMiembros() {
    const act = activeMembers();
    byId('mem-summary').textContent = act.length + ' miembros · ' + act.filter(m => m.cat === 'Directivo').length + ' directivos · ' + act.filter(m => m.cat === 'Consejero').length + ' consejeros · ' + act.filter(m => m.cat === 'Conquistador').length + ' conquistadores' + (act.some(m => m.brasil) ? ' · ' + act.filter(m => m.brasil).length + ' van a Brasil' : '');
    const search = (byId('mem-search').value || '').toLowerCase();
    const group = byId('mem-group').value;
    // opciones de filtro por unidad (se arman con las unidades que existan)
    const fsel = byId('mem-filter');
    const prev = fsel.value;
    byId('mem-filter-units').innerHTML = '<option value="u:none">Sin unidad</option>' + unitsList().map(u => `<option value="u:${u.id}">Unidad: ${escapeHtml(u.name)}</option>`).join('');
    fsel.value = prev;
    const filter = fsel.value;

    let list = filter === 'archivados' ? db.members.filter(m => m.archived) : activeMembers();
    if (search) list = list.filter(m => m.name.toLowerCase().includes(search));
    if (filter === 'brasil') list = list.filter(m => m.brasil);
    else if (filter.startsWith('u:')) {
        const uidSel = filter.slice(2);
        list = uidSel === 'none' ? list.filter(m => !m.unit) : list.filter(m => m.unit === uidSel);
    }
    else if (filter && filter !== 'archivados') list = list.filter(m => m.cat === filter);

    const card = (m) => {
        const deuda = memberDebt(m.id);
        return `
        <div class="card tight" onclick="openProfile('${m.id}')">
            <div class="row static" style="border-bottom:none">
                <div class="row-info"><b>${escapeHtml(m.name)}</b><br><small>${m.cat}${m.clase ? ' · ' + m.clase : ''}${m.unit && unitName(m.unit) ? ' · ' + escapeHtml(unitName(m.unit)) : ''}${m.brasil ? ' · Brasil' : ''}${m.archived ? ' · Archivado' : ''}</small></div>
                <span class="badge ${m.archived ? 'bg-neutral' : (deuda > 0 ? 'bg-due' : 'bg-ok')}">${m.archived ? 'Archivado' : (deuda > 0 ? fmt(deuda) : 'Al día')}</span>
            </div>
        </div>`;
    };
    const byName = (a, b) => a.name.localeCompare(b.name, 'es');
    let groups;
    if (group === 'unidad') {
        groups = unitsList().map(u => ({ title: u.name, items: list.filter(m => m.unit === u.id).sort(byName) })).filter(g => g.items.length);
        const rest = list.filter(m => !m.unit || !unitName(m.unit)).sort(byName);
        if (rest.length) groups.push({ title: 'Sin unidad (directivos / sin asignar)', items: rest });
    } else if (group === 'cat') {
        groups = ['Directivo', 'Consejero', 'Conquistador'].map(c => ({ title: c + 's', items: list.filter(m => m.cat === c).sort(byName) })).filter(g => g.items.length);
    } else {
        groups = [{ title: null, items: list }];
    }
    byId('list-miembros').innerHTML = list.length ? groups.map(g =>
        (g.title ? `<div class="grp-title"><span>${escapeHtml(g.title)}</span><span>${g.items.length}</span></div>` : '') + g.items.map(card).join('')
    ).join('') : '<div class="empty">No se encontraron miembros.</div>';
}

function renderCuotas() {
    document.querySelectorAll('[data-cuotatab]').forEach(b => b.classList.toggle('active', b.dataset.cuotatab === uiCuotaTab));
    const label = document.getElementById('cuota-period-label');
    let html = '';
    if (uiCuotaTab === 'pendientes') {
        label.textContent = 'Todos los cargos pendientes o parciales, de cualquier mes.';
        const pend = db.charges.filter(c => !c.archived && !isFullyPaid(c)).sort((a, b) => (a.period || '').localeCompare(b.period || ''));
        html = pend.length ? pend.map(c => {
            const m = db.members.find(x => x.id === c.memberId);
            if (!m) return '';
            const restante = chargeRemaining(c);
            return `<div class="row" onclick="openChargeModal('${c.id}')">
                <div class="row-info"><b>${escapeHtml(m.name)}</b><br><small>${escapeHtml(c.concept)}${c.amountPaid > 0 ? ' · pagó ' + fmt(c.amountPaid) + ' de ' + fmt(c.amount) : ''}</small></div>
                <span class="chip unpaid">${c.amountPaid > 0 ? 'Falta ' + fmt(restante) : fmt(restante)}</span>
            </div>`;
        }).join('') : '<div class="empty">No hay cargos pendientes. ¡Todos al día!</div>';
    } else {
        const sourceType = uiCuotaTab === 'normal' ? 'cuota-normal' : 'cuota-brasil';
        label.innerHTML = `
            <div style="display:flex; align-items:center; justify-content:space-between">
                <button class="btn-ghost" onclick="shiftCuotaYear(-1)">‹ ${uiCuotaYear - 1}</button>
                <b style="color:var(--primary)">${uiCuotaYear}</b>
                <button class="btn-ghost" onclick="shiftCuotaYear(1)">${uiCuotaYear + 1} ›</button>
            </div>
        `;
        let months = sourceType === 'cuota-normal'
            ? (cfgInscripcion() ? [uiCuotaYear + '-00'] : []).concat(periodRange(uiCuotaYear + '-' + String(cfgNormalIni()).padStart(2, '0'), uiCuotaYear + '-' + String(cfgNormalFin()).padStart(2, '0')))
            : periodRange(uiCuotaYear + '-' + String(cfgBrasilIni()).padStart(2, '0'), uiCuotaYear + '-' + String(cfgBrasilFin()).padStart(2, '0'));
        let members = sourceType === 'cuota-normal' ? activeMembers().filter(m => m.cat === 'Conquistador') : activeMembers().filter(m => m.brasil);
        if (!members.length) {
            html = `<div class="empty">${sourceType === 'cuota-brasil' ? 'No hay miembros anotados para Brasil.' : 'No hay conquistadores cargados (la cuota mensual solo aplica a esa categoría).'}</div>`;
        } else if (!months.length) {
            html = '<div class="empty">No hay meses para mostrar en este año.</div>';
        } else {
            const head = '<th>Miembro</th>' + months.map(p => `<th style="text-align:center">${parseInt(p.split('-')[1], 10) === 0 ? 'Inscripción' : MESES[parseInt(p.split('-')[1], 10) - 1]}</th>`).join('');
            const rows = members.map(m => {
                const cells = months.map(p => {
                    const charge = db.charges.find(c => c.memberId === m.id && c.sourceType === sourceType && c.period === p && !c.archived);
                    if (!charge) {
                        // Mes sin cargo generado: si es un mes futuro (todavía no
                        // devengado) y le corresponde al miembro, se habilita el
                        // pago adelantado; si no, se deja el guion como estaba.
                        const yearOfCol = p.slice(0, 4);
                        const elegible = sourceType === 'cuota-normal' ? m.cat === 'Conquistador' : !!m.brasil;
                        const from = cuotaFromForYear(m, sourceType, yearOfCol);
                        const esFuturo = p > currentPeriod();
                        if (elegible && esFuturo && p >= from && p <= yearOfCol + '-12') {
                            return `<td style="text-align:center; cursor:pointer" class="muted" title="Pago adelantado (mes aún no vencido)" onclick="payCuotaAdvance('${m.id}','${sourceType}','${p}')"><b>+</b></td>`;
                        }
                        return '<td style="text-align:center" class="muted">—</td>';
                    }
                    if (sourceType === 'cuota-brasil') {
                        return `<td style="text-align:center"><input type="checkbox" ${isFullyPaid(charge) ? 'checked' : ''} onchange="toggleCuotaCell('${charge.id}')"></td>`;
                    }
                    let cls = 'text-danger', txt = '·';
                    if (isFullyPaid(charge)) { cls = 'text-success'; txt = '✓'; }
                    else if (charge.amountPaid > 0) { cls = 'text-warn'; txt = '½'; }
                    return `<td style="text-align:center; cursor:pointer" class="${cls}" onclick="toggleCuotaCell('${charge.id}')"><b>${txt}</b></td>`;
                }).join('');
                return `<tr><td><b>${escapeHtml(m.name)}</b>${m.unit && unitName(m.unit) ? '<br><small class="muted">' + escapeHtml(unitName(m.unit)) + '</small>' : ''}</td>${cells}</tr>`;
            }).join('');
            html = `
                <div class="tbl-wrap card">

/* =========================================================================
   ARCHIVOS (fotos de comprobantes) — se guardan en IndexedDB, no en
   localStorage, para no llenar el espacio de los datos del club.
   ========================================================================= */
function idbOpen() {
    return new Promise((res, rej) => {
        if (!window.indexedDB) { rej(new Error('IndexedDB no disponible')); return; }
        const r = indexedDB.open('asm_files', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('files'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
    });
}
async function idbPut(key, val) {
    const d = await idbOpen();
    return new Promise((res, rej) => {
        const t = d.transaction('files', 'readwrite');
        t.objectStore('files').put(val, key);
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
    });
}
async function idbGet(key) {
    const d = await idbOpen();
    return new Promise((res, rej) => {
        const t = d.transaction('files', 'readonly');
        const q = t.objectStore('files').get(key);
        q.onsuccess = () => res(q.result);
        q.onerror = () => rej(q.error);
    });
}
async function idbDel(key) {
    const d = await idbOpen();
    return new Promise((res, rej) => {
        const t = d.transaction('files', 'readwrite');
        t.objectStore('files').delete(key);
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
    });
}
const imgCache = new Map();
async function hydrateImages() {
    const els = document.querySelectorAll('img[data-imgid]');
    for (const el of els) {
        const id = el.dataset.imgid;
        try {
            let u = imgCache.get(id);
            if (!u) { u = await idbGet(id); if (u) imgCache.set(id, u); }
            if (u) el.src = u;
        } catch (e) { /* sin imagen */ }
    }
}
function resizeImage(file) {
    return new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => {
            const img = new Image();
            img.onload = () => {
                const s = Math.min(1, 1400 / Math.max(img.width, img.height));
                const w = Math.round(img.width * s), h = Math.round(img.height * s);
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const g = c.getContext('2d');
                g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
                g.drawImage(img, 0, 0, w, h);
                res(c.toDataURL('image/jpeg', 0.72));
            };
            img.onerror = () => rej(new Error('No se pudo leer la imagen'));
            img.src = fr.result;
        };
        fr.onerror = () => rej(fr.error);
        fr.readAsDataURL(file);
    });
}

function riRemoveImg(id) {

/* Asientos: se puede asignar el comprobante a CUALQUIER movimiento ya hecho
   (buscador), no solo a los del evento. Al crear uno nuevo también se puede
   generar el asiento del reintegro. */
function renderRiAsientos() {
    const r = window.__riEditing;
    if (!window.__riSel) window.__riSel = new Set(r ? (r.entryIds || []) : []);
    const accOpts = (sel) => db.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('');
    const evId = byId('ri-evento').value;
    const ev = evId ? db.events.find(x => x.id === evId) : null;
    let html = `<div class="field"><label>Asignar a movimientos ya hechos</label>
        <input id="ri-buscar" type="search" placeholder="Buscar por descripción, fecha o monto…" oninput="riFilterAsientos()">
        <div id="ri-lista" class="member-pick mt"></div>
        <small class="muted" style="display:block; margin-top:4px; font-size:0.7rem">Marcá los movimientos que respalda este comprobante. Podés dejarlo sin asignar.</small></div>`;
    if (!r) {
        html += `
        <div class="checkline">
            <input id="ri-new-entry" type="checkbox" ${window.__riSel.size ? '' : 'checked'} onchange="window.__riNewTouched=true; byId('ri-new-entry-wrap').style.display=this.checked?'block':'none'">
            <label for="ri-new-entry" style="text-transform:none; font-size:0.85rem; font-weight:500">Registrar también un asiento nuevo por este reintegro</label>
        </div>
        <div id="ri-new-entry-wrap" style="display:${window.__riSel.size ? 'none' : 'block'}">
            <div class="btn-row">
                <div class="field" style="flex:1"><label>Debe</label><select id="ri-debe">${accOpts(ev ? ev.accountResultId : 'gastos-generales')}</select></div>
                <div class="field" style="flex:1"><label>Haber</label><select id="ri-haber">${accOpts('mp')}</select></div>
            </div>
        </div>`;
    }
    byId('ri-asientos').innerHTML = html;
    riFilterAsientos();
}
function riFilterAsientos() {
    const box = byId('ri-lista'); if (!box) return;
    const q = ((byId('ri-buscar') || {}).value || '').trim().toLowerCase();
    const evId = byId('ri-evento').value;
    const ev = evId ? db.events.find(x => x.id === evId) : null;
    const all = sortEntries(db.entries.filter(e => !e.voided)).reverse();
    const sel = window.__riSel;
    let list;
    if (q) {
        list = all.filter(e => (e.desc + ' ' + e.fecha + ' ' + e.monto + ' ' + fmt(e.monto)).toLowerCase().includes(q)).slice(0, 60);
    } else {
        const evl = ev ? all.filter(e => e.debe === ev.accountResultId || e.haber === ev.accountResultId) : [];
        const picked = all.filter(e => sel.has(e.id));
        const seen = new Set();
        list = [...picked, ...evl, ...all.slice(0, 25)].filter(e => !seen.has(e.id) && seen.add(e.id));
    }
    box.innerHTML = list.length
        ? list.map(e => `<label><input type="checkbox" class="ri-entry-chk" value="${e.id}" ${sel.has(e.id) ? 'checked' : ''} onchange="riToggleSel(this)"> ${escapeHtml(e.fecha)} — ${escapeHtml(e.desc)} <span class="muted small">(${fmt(e.monto)})</span></label>`).join('')
        : '<small class="muted">No se encontraron movimientos.</small>';
}
function riToggleSel(el) {
    if (el.checked) window.__riSel.add(el.value); else window.__riSel.delete(el.value);
    const nw = byId('ri-new-entry');
    if (nw && !window.__riNewTouched && window.__riSel.size) { nw.checked = false; byId('ri-new-entry-wrap').style.display = 'none'; }
    const m = byId('ri-monto');
    if (m && !m.disabled && !m.value && window.__riSel.size) {
        const e = db.entries.find(x => x.id === Array.from(window.__riSel)[0]);
        if (e) m.value = e.monto;
    }
}
async function saveReintegro(editId) {
    const r = editId ? db.reintegros.find(x => x.id === editId) : null;
    const titulo = byId('ri-titulo').value.trim() || 'Comprobante de reintegro';
    const sel = byId('ri-persona').value;
    let personaId = null, nombre = '';
    if (sel.startsWith('m:')) {
        personaId = sel.slice(2);
        const m = db.members.find(x => x.id === personaId);
        nombre = m ? m.name : '';
    } else if (sel.startsWith('n:')) {
        nombre = sel.slice(2);
    } else if (sel === '__manual__') {
        nombre = byId('ri-persona-manual').value.trim();
        if (nombre && byId('ri-persona-save').checked) {
            db.extraNames = db.extraNames || [];
            if (!db.extraNames.includes(nombre)) db.extraNames.push(nombre);
        }
    }
    if (!nombre) { alert('Elegí o escribí el nombre de la persona.'); return; }
    const evId = byId('ri-evento').value || null;
    const ev = evId ? db.events.find(x => x.id === evId) : null;
    const entryIds = Array.from(window.__riSel || []);
    const nota = byId('ri-nota').value.trim();

    let monto = r ? r.monto : parseFloat(byId('ri-monto').value);
    if (!r && (!monto || monto <= 0)) { alert('Ingresá un monto válido.'); return; }
    let newEntry = null;
    if (!r && byId('ri-new-entry').checked) {
        const debe = byId('ri-debe').value, haber = byId('ri-haber').value;
        if (debe === haber) { alert('La cuenta Debe y Haber no pueden ser la misma.'); return; }
    }

    // fotos: las nuevas se guardan en IndexedDB, las quitadas se borran
    try {
        for (const im of riDraft.imgs) if (im.isNew) { await idbPut(im.id, im.url); imgCache.set(im.id, im.url); }
        for (const id of riDraft.removed) { await idbDel(id); imgCache.delete(id); }
    } catch (e) {
        alert('No se pudieron guardar las fotos en este navegador (' + e.message + '). Probá con menos fotos o en otro navegador.');
        return;
    }
    const imgIds = riDraft.imgs.map(i => i.id);
    const concepto = titulo + (ev ? ' — ' + ev.name : '');

    if (r) {
        r.titulo = titulo; r.personaId = personaId; r.personaNombre = nombre; r.eventId = evId;
        r.entryIds = entryIds; r.nota = nota; r.imgIds = imgIds;
        const comp = db.comprobantes.find(x => x.id === r.compId);
        if (comp) { comp.titulo = titulo; comp.memberId = personaId; comp.memberName = nombre; comp.concepto = concepto; }
        save();
        showToast('Reintegro actualizado.');
        openReintegroDetail(r.id);
        return;
    }
    const fecha = isoToFecha(byId('ri-fecha').value || todayISO());
    const desc = titulo + ' — ' + nombre + (ev ? ' (' + ev.name + ')' : '');
    if (byId('ri-new-entry').checked) {
        newEntry = postEntry(desc, byId('ri-debe').value, byId('ri-haber').value, monto, fecha);
        entryIds.push(newEntry.id);
    }
    const comp = makeComprobante('reintegro', personaId, concepto, monto, newEntry ? newEntry.id : null, { fecha, memberName: nombre, titulo });
    const rec = {
        id: uid('ri'), titulo, personaId, personaNombre: nombre, monto, fecha, eventId: evId,
        entryIds, createdEntryId: newEntry ? newEntry.id : null, compId: comp.id, imgIds, nota, voided: false
    };
    if (newEntry) newEntry.reintegroId = rec.id;
    db.reintegros.push(rec);
    save();
    showToast('Reintegro registrado y comprobante generado.');
    openReceiptView(comp.id);
}
function openReintegroDetail(id) {
    const r = db.reintegros.find(x => x.id === id);
    if (!r) return;
    const ev = r.eventId ? db.events.find(e => e.id === r.eventId) : null;
    const entries = db.entries.filter(e => (r.entryIds || []).includes(e.id));
    openModalHTML(`
        <h2>${escapeHtml(r.titulo)} — ${escapeHtml(r.personaNombre)}</h2>
        <div class="card tight">
            <div class="row static"><span>Monto</span><strong class="${r.voided ? 'text-danger' : ''}">${r.voided ? 'ANULADO · ' : ''}${fmt(r.monto)}</strong></div>
            <div class="row static"><span>Fecha</span><span>${escapeHtml(r.fecha)}</span></div>
            <div class="row static" style="border-bottom:none"><span>Evento</span><span>${ev ? escapeHtml(ev.name) : '—'}</span></div>
        </div>
        ${entries.length ? `<h3 class="mt" style="font-size:0.85rem">Asientos que afecta</h3><div class="card tight">${entries.map(e => `<div class="row static"><div class="row-info">${escapeHtml(e.desc)}<br><small>${escapeHtml(e.fecha)} · ${escapeHtml(accountLabel(e.debe))} → ${escapeHtml(accountLabel(e.haber))}</small></div><strong>${fmt(e.monto)}</strong></div>`).join('')}</div>` : ''}
        <h3 class="mt" style="font-size:0.85rem">Fotos del comprobante</h3>
        <div class="thumbs">${(r.imgIds || []).length ? r.imgIds.map(i => `<div class="thumb" onclick="openImageViewer('${i}', &quot;openReintegroDetail('${r.id}')&quot;)"><img data-imgid="${i}" alt=""></div>`).join('') : '<small class="muted">Sin fotos.</small>'}</div>
        ${r.nota ? `<p class="small muted mt">${escapeHtml(r.nota)}</p>` : ''}
        <button class="btn btn-blue mt" onclick="openReceiptView('${r.compId}')">Ver / compartir comprobante</button>
        <button class="btn btn-accent mt" onclick="openReintegroModal('${r.id}')">Editar</button>
        ${r.voided ? '' : `<button class="btn btn-outline danger mt" onclick="voidReintegro('${r.id}')">Anular reintegro</button>`}
        <button class="btn btn-outline mt" onclick="closeModal()">Cerrar</button>
    `);
    hydrateImages();
}
function voidReintegro(id) {
    const r = db.reintegros.find(x => x.id === id);
    if (!r) return;
    if (!confirm('¿Anular este reintegro? Se anulan el comprobante y el asiento que se creó con él (quedan guardados como anulados, no se borran).')) return;
    r.voided = true;
    const comp = db.comprobantes.find(x => x.id === r.compId);
    if (comp) comp.voided = true;
    const e = db.entries.find(x => x.id === r.createdEntryId);
    if (e) e.voided = true;
    save();
    openReintegroDetail(id);
    showToast('Reintegro anulado.');
}

    { t: 'Este es el día que hizo Jehová; nos gozaremos y alegraremos en él.', r: 'Salmos 118:24' }
];
const DIAS_CORTOS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const REM_KEY = 'asm_rem_last';

function defaultReminders() {
    return [
        { id: 'rem-sab', name: 'Viernes — Feliz sábado', days: [5], time: '20:00', title: 'Feliz sábado 🙏', message: 'Feliz sábado, {nombre}. Que Dios bendiga tu día.', verse: true, enabled: true },
        { id: 'rem-sem', name: 'Entre semana — Finanzas al día', days: [1, 2, 3, 4], time: '19:00', title: 'Finanzas del club', message: 'Hola {nombre}, no olvides mantener al tanto las finanzas del club.', verse: false, enabled: true }
    ];
}
function tesoreroFirstName() { return (tesoreroName().split(/\s+/)[0]) || 'tesorero'; }
function reminderText(r) {
    let body = (r.message || '').replace(/\{nombre\}/g, tesoreroFirstName());
    if (r.verse) {
        const v = VERSICULOS[Math.floor(Math.random() * VERSICULOS.length)];
        body += '\n\n"' + v.t + '" — ' + v.r;
    }
    return body;
}
function fireReminder(r) {
    const body = reminderText(r);
    showReminderBanner(r.title || 'Recordatorio', body);
    try {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(r.title || 'Recordatorio', { body, icon: LOGO_ICON });
        }
    } catch (e) { /* algunos celulares solo permiten notificaciones desde una app instalada: queda el aviso en pantalla */ }
}
function showReminderBanner(title, body) {
    const box = byId('reminder-banner');
    const el = document.createElement('div');
    el.className = 'rem-item';
    el.innerHTML = `<button onclick="this.parentNode.remove()">×</button><b>${escapeHtml(title)}</b><div>${escapeHtml(body)}</div>`;
    box.appendChild(el);
}
function checkReminders() {
    if (!db || !db.settings) return;
    const now = new Date();
    const today = todayISO();
    let last = {};
    try { last = JSON.parse(localStorage.getItem(REM_KEY) || '{}'); } catch (e) { last = {}; }
    let changed = false;
    (db.settings.reminders || []).forEach(r => {
        if (!r.enabled || !(r.days || []).includes(now.getDay())) return;
        const [h, m] = (r.time || '20:00').split(':').map(Number);
        const sched = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
        if (now < sched || now - sched > 12 * 3600 * 1000 || last[r.id] === today) return;
        last[r.id] = today;
        changed = true;
        fireReminder(r);
    });
    if (changed) { try { localStorage.setItem(REM_KEY, JSON.stringify(last)); } catch (e) { /* sin almacenamiento */ } }
}
function askNotificationPermission() {
    if (!('Notification' in window)) { alert('Este navegador no soporta notificaciones del dispositivo. Los recordatorios igual aparecen como aviso dentro de la app.'); return; }
    Notification.requestPermission().then(p => {
        showToast(p === 'granted' ? 'Notificaciones activadas.' : 'No se dieron permisos de notificación.');
        renderAll();
    });
}

function deleteReminder(id) {

let homeAnimated = false;
function mesLargo(p) {
    const [y, m] = p.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString('es-AR', { month: 'long' });
}
function cuotasDelMes() {
    const cur = currentPeriod();
    const ch = db.charges.filter(c => !c.archived && c.period === cur && c.sourceType !== 'evento');
    const total = ch.reduce((s, c) => s + c.amount, 0);
    const cobrado = ch.reduce((s, c) => s + Math.min(c.amountPaid || 0, c.amount), 0);
    return { total, cobrado, pct: total > 0 ? cobrado / total : null };
}
function backupDias() {
    const last = db.settings.lastBackup;
    return last ? Math.floor((Date.now() - last) / 864e5) : null;
}
function homeAlerts() {

        out.push({ tone: 'var(--danger)', t: deudores.length + (deudores.length === 1 ? ' miembro con deuda' : ' miembros con deuda'), s: 'Suman ' + fmt(tot) + '. Tocá para ver el detalle.', go: "setCuotaTab('pendientes'); showView('cuotas')" });
    }

    if ((db.members.length || db.entries.length) && (bd === null || bd >= 30)) {

    }
    const pin = db.notes.filter(n => n.pinned && !n.done)[0];
    if (pin) out.push({ tone: 'var(--gold)', t: pin.title || 'Nota fijada', s: (pin.text || '').slice(0, 70), go: "openNoteModal('" + pin.id + "')" });
    const borr = db.events.filter(e => !e.archived && e.tipo !== 'general').map(e => ({ e, p: eventProgress(e) })).filter(x => x.p.total > x.p.cobrado)[0];
    if (borr) out.push({ tone: 'var(--blue)', t: borr.e.name + ': ' + borr.p.pagaron + ' de ' + borr.p.totalMiembros + ' pagaron', s: 'Faltan cobrar ' + fmt(borr.p.total - borr.p.cobrado), go: "showView('eventos'); openEventDetail('" + borr.e.id + "')" });

function countUp(el, to, ms) {
    const t0 = performance.now();
    const step = (t) => {
        const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
        el.textContent = fmt(to * e);
        if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

/* ---------------- Cinta ---------------- */
function nextReminder() {
    const now = new Date();
    let best = null;
    (db.settings.reminders || []).filter(r => r.enabled).forEach(r => {
        const [h, m] = (r.time || '20:00').split(':').map(Number);
        for (let d = 0; d < 8; d++) {
            const t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, h, m);
            if ((r.days || []).includes(t.getDay()) && t > now) { if (!best || t < best.t) best = { t, r }; break; }
        }
    });
    return best;
}
function deltaPct(a, b) { return b > 0 ? Math.round((a - b) / b * 100) : null; }
function cintaItems() {
    const it = [];
    const add = (k, v, tone, go, delta) => it.push({ k, v, tone: tone || '', go: go || '', delta: delta || null });
    const cur = currentPeriod(), mes = mesLargo(cur);
    const flows = monthlyFlows();
    const c = flows[cur] || { ing: 0, gas: 0 }, pv = flows[addMonths(cur, -1)] || { ing: 0, gas: 0 };
    const dIng = deltaPct(c.ing, pv.ing), dGas = deltaPct(c.gas, pv.gas);

    add('Disponible total', fmt(getBalance('mp') + getBalance('caja')), 'good', "goFin('balance')");
    add('Caja', fmt(getBalance('caja')), '', "goFin('mayor')");
    add('Mercado Pago', fmt(getBalance('mp')), '', "goFin('mayor')");
    if (getBalance('reservas') > 0) add('Reservas', fmt(getBalance('reservas')), '', "goFin('balance')");
    if (db.entries.length) {
        add('Ingresos de ' + mes, fmt(c.ing), 'good', "goFin('diario')", dIng === null ? null : { v: dIng, goodUp: true });
        add('Gastos de ' + mes, fmt(c.gas), c.gas > c.ing ? 'bad' : '', "goFin('diario')", dGas === null ? null : { v: dGas, goodUp: false });
        add('Resultado de ' + mes, fmt(c.ing - c.gas), c.ing - c.gas >= 0 ? 'good' : 'bad', "goFin('resultados')");
    }
    const cm = cuotasDelMes();
    if (cm.pct !== null) add('Cuotas de ' + mes, Math.round(cm.pct * 100) + '% cobradas · ' + fmt(cm.cobrado) + ' de ' + fmt(cm.total), cm.pct >= 0.7 ? 'good' : 'warn', "showView('cuotas')");
    const por = totalPendienteMiembros();
    add('Por cobrar a miembros', fmt(por), por > 0 ? 'warn' : 'good', "setCuotaTab('pendientes'); showView('cuotas')");
    const top = activeMembers().map(m => ({ m, d: memberDebt(m.id) })).filter(x => x.d > 0).sort((a, b) => b.d - a.d)[0];
    if (top) add('Mayor deuda', top.m.name + ' ' + fmt(top.d), 'bad', "openProfile('" + top.m.id + "')");
    const act = activeMembers();
    if (act.length) add('Miembros al día', act.filter(m => memberDebt(m.id) <= 0).length + ' de ' + act.length, '', "showView('miembros')");
    const bs = cuotaStats('cuota-brasil', new Date().getFullYear());
    if (bs.total > 0) add('Cuota Brasil ' + new Date().getFullYear(), Math.round(bs.paid / bs.total * 100) + '% cobrada · falta ' + fmt(bs.pend), bs.paid / bs.total >= 0.5 ? 'good' : 'warn', "setCuotaTab('brasil'); showView('cuotas')");
    db.events.filter(e => !e.archived).slice(0, 3).forEach(e => {
        if (e.tipo === 'general') add(e.name, fmt(getBalance(e.accountResultId)), getBalance(e.accountResultId) >= 0 ? 'good' : 'bad', "showView('eventos')");
        else { const p = eventProgress(e); add(e.name, p.pct + '% cobrado · ' + p.pagaron + ' de ' + p.totalMiembros + ' pagaron', p.pct >= 80 ? 'good' : 'warn', "showView('eventos')"); }
    });
    if (getBalance('club-pasivo') > 0) add('Deudas del club', fmt(getBalance('club-pasivo')), 'bad', "goFin('balance')");
    if (db.entries.length) {
        const er = estadoResultados();
        add('Resultado acumulado', fmt(er.resultado), er.resultado >= 0 ? 'good' : 'bad', "goFin('resultados')");
        const last = sortEntries(db.entries.filter(e => !e.voided)).slice(-1)[0];
        if (last) add('Último movimiento', (last.desc.length > 30 ? last.desc.slice(0, 29) + '…' : last.desc) + ' ' + fmt(last.monto), '', "goFin('diario')");
    }
    if (!db.members.length) it.unshift({ k: 'Bienvenido', v: 'Cargá tu primer miembro para empezar', tone: 'good', go: 'openMemberModal()', delta: null });
    return it;
}

    openModalHTML(`
        <h2>${g ? 'Registrar gasto' : 'Registrar ingreso'}</h2>
        <div class="field"><label>Monto</label><input id="mv-monto" type="number" min="0" inputmode="decimal" autofocus></div>
        <div class="field"><label>${g ? '¿Qué se pagó?' : '¿Qué se cobró?'}</label><input id="mv-desc" type="text" placeholder="${g ? 'Ej: Compra de carpas' : 'Ej: Venta de rifas'}"></div>
        <div class="field"><label>Fecha</label><input id="mv-fecha" type="date" value="${todayISO()}"></div>
        <div class="field"><label>${g ? 'Pagado con' : 'Entró en'}</label>
            <select id="mv-medio"><option value="caja">Caja (efectivo)</option><option value="mp">Mercado Pago</option><option value="reservas">Reservas</option></select></div>
        <div class="field"><label>${g ? '¿En qué rubro?' : '¿De qué es el ingreso?'}</label><select id="mv-cat">${accountOptionsMov(kind)}</select></div>
        <p class="small muted">Podés poner una fecha anterior para cargar movimientos de meses pasados.</p>
        <button class="btn btn-accent" onclick="saveMovimiento('${kind}')">Guardar ${g ? 'gasto' : 'ingreso'}</button>
        <button class="btn btn-outline mt" onclick="closeModal()">Cancelar</button>
    `);
}
function saveMovimiento(kind) {
    const monto = parseFloat(byId('mv-monto').value);
    if (!monto || monto <= 0) { alert('Ingresá un monto válido.'); return; }
    const g = kind === 'gasto';
    const desc = byId('mv-desc').value.trim() || (g ? 'Gasto' : 'Ingreso');
    const fecha = isoToFecha(byId('mv-fecha').value || todayISO());
    const medio = byId('mv-medio').value, cat = byId('mv-cat').value;
    if (g) postEntry(desc, cat, medio, monto, fecha); else postEntry(desc, medio, cat, monto, fecha);
    closeModal();
    save();
    showToast(g ? 'Gasto registrado.' : 'Ingreso registrado.');
}

/* ---------------- Buscador general ---------------- */
function openSearch() {
    openModalHTML(`<input id="sr-q" class="sr-input" type="search" placeholder="Buscar miembro, comprobante, nota, evento…" oninput="runSearch(this.value)" autocomplete="off"><div id="sr-res"><div class="empty" style="padding:30px 10px">Escribí para buscar en toda la app.</div></div>`);
    setTimeout(() => { const q = byId('sr-q'); if (q) q.focus(); }, 60);
}
function runSearch(q) {
    q = q.trim().toLowerCase();
    const box = byId('sr-res');
    if (!q) { box.innerHTML = '<div class="empty" style="padding:30px 10px">Escribí para buscar en toda la app.</div>'; return; }
    const has = (...xs) => xs.join(' ').toLowerCase().includes(q);
    const G = [];
    const row = (t, s, go) => `<div class="row" onclick="${go}"><div class="row-info"><b>${escapeHtml(t)}</b><br><small>${escapeHtml(s)}</small></div>${ic('chevron')}</div>`;
    const mem = db.members.filter(m => has(m.name, unitName(m.unit), m.cat)).slice(0, 6);
    if (mem.length) G.push(['Miembros', mem.map(m => row(m.name, m.cat + (m.unit ? ' · ' + unitName(m.unit) : '') + (m.archived ? ' · archivado' : ''), `openProfile('${m.id}')`))]);
    const cmp = db.comprobantes.filter(c => has(c.memberName, c.concepto, c.titulo, String(c.numero))).slice(-6).reverse();
    if (cmp.length) G.push(['Comprobantes', cmp.map(c => row('#' + String(c.numero).padStart(4, '0') + ' · ' + receiptFullTitle(c), c.concepto + ' · ' + c.fecha, `openReceiptView('${c.id}')`))]);
    const re = db.reintegros.filter(r => has(r.titulo, r.personaNombre, r.nota)).slice(0, 5);
    if (re.length) G.push(['Reintegros', re.map(r => row(r.titulo + ' — ' + r.personaNombre, fmt(r.monto) + ' · ' + r.fecha, `openReintegroDetail('${r.id}')`))]);
    const ev = db.events.filter(e => has(e.name, e.desc)).slice(0, 5);
    if (ev.length) G.push(['Eventos', ev.map(e => row(e.name, e.archived ? 'Finalizado' : 'Activo', `openEventDetail('${e.id}')`))]);
    const nt = db.notes.filter(n => has(n.title, n.text)).slice(0, 5);
    if (nt.length) G.push(['Notas', nt.map(n => row(n.title || 'Sin título', (n.text || '').slice(0, 60), `openNoteModal('${n.id}')`))]);
    const en = db.entries.filter(e => !e.voided && has(e.desc)).slice(-5).reverse();
    if (en.length) G.push(['Movimientos', en.map(e => row(e.desc, e.fecha + ' · ' + fmt(e.monto), `openEntryModal('${e.id}')`))]);
    box.innerHTML = G.length ? G.map(g => `<div class="sr-group">${g[0]}</div>${g[1].join('')}`).join('') : '<div class="empty" style="padding:30px 10px">No encontré nada con "' + escapeHtml(q) + '".</div>';
}

function applyChrome() {
    limpiarCargosHuerfanos();
    byId('club-title').textContent = db.settings.clubName;
    document.documentElement.style.setProperty('--hdr-h', document.querySelector('header').offsetHeight + 'px');
}
(function () {
    const c = document.getElementById('cinta');
    if (!c) return;

/* ---- Informe: miembros del club (solo nombre, tipo y clase) ---- */
function buildMiembrosPDFBlob() {
    const { doc, y: y0 } = pdfStart('Miembros del club');
    const ms = activeMembers();
    const esConqui = m => m.cat === 'Conquistador';
    const orden = c => { const i = CLASES_CONQUISTADOR.indexOf(c); return i < 0 ? 99 : i; };
    const conq = ms.filter(esConqui).sort((a, b) => orden(a.clase) - orden(b.clase) || a.name.localeCompare(b.name, 'es'));
    const lid = ms.filter(m => !esConqui(m)).sort((a, b) => a.name.localeCompare(b.name, 'es'));
    let y = pdfIntro(doc, y0, 'Este informe lista a los miembros de ' + db.settings.clubName + ' al ' + todayStr() + '. Hay ' + ms.length + ' miembro(s) en total: ' + conq.length + ' conquistador(es) y ' + lid.length + ' líder(es). Para cada conquistador se indica la clase que cursa.');
    const rows = conq.map(m => [m.name, 'Conquistador', m.clase || '—']).concat(lid.map(m => [m.name, 'Líder', '—']));
    y = pdfTable(doc, y, ['Nombre', 'Tipo', 'Clase'], rows.length ? rows : [['—', '—', 'Todavía no hay miembros cargados']]);
    return pdfFinish(doc, y, 'Miembros_' + todayISO() + '.pdf');
}
REPORTES.splice(4, 0, { id: 'miembros-pdf', label: 'Miembros del club (PDF)', build: buildMiembrosPDFBlob, hint: 'Solo nombre, si es conquistador o líder y la clase de cada conquistador' });


/* ---- Eliminar miembro junto con su deuda ---- */
function deleteMember(mid) {
    const m = db.members.find(x => x.id === mid);
    if (!m) return;
    const deuda = memberDebt(mid);
    const msg = '¿Eliminar a ' + m.name + ' definitivamente?' +
        (deuda > 0 ? '\n\nSe borra también su deuda pendiente de ' + arsStr(deuda) + ' (ya no se va a contar como "por cobrar").' : '\n\nNo tiene deuda pendiente.') +
        '\n\nLos pagos, comprobantes y asientos ya registrados se conservan para no alterar la contabilidad. Esta acción no se puede deshacer.';
    if (!confirm(msg)) return;
    db.charges.filter(c => c.memberId === mid).forEach(c => { c.archived = true; });
    db.members = db.members.filter(x => x.id !== mid);
    logHist('miembros', 'Miembro eliminado: ' + m.name + (deuda > 0 ? ' (con su deuda de ' + arsStr(deuda) + ')' : ''));
    closeModal();
    save();
    showToast('Miembro y deuda eliminados.');
}


/* ---------------- Cargos de miembros que ya no están activos ----------------
   Si el miembro se borró (o está archivado), sus cargos quedan afuera de eventos,
   cuotas y deudas. Si se restaura, vuelven solos. */
function limpiarCargosHuerfanos() {
    let cambio = false;
    db.charges.forEach(c => {
        const m = db.members.find(x => x.id === c.memberId);
        if (!m) { if (!c.archived) { c.archived = true; cambio = true; } }
        else if (m.archived) { if (!c.archived) { c.archived = true; c.archByMember = true; cambio = true; } }
        else if (c.archByMember && c.archived) { c.archived = false; delete c.archByMember; cambio = true; }
    });
    if (cambio) { try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {} }
}

/* ---------------- Eliminar evento / proyecto ---------------- */
function accountLabel(id) {
    const a = db.accounts.find(x => x.id === id);
    return a ? a.name : (/^ev-/.test(id) ? 'Evento eliminado' : id);
}
function deleteEvent(id) {
    const ev = db.events.find(x => x.id === id);
    if (!ev) return;
    const ents = db.entries.filter(e => !e.voided && (e.debe === ev.accountResultId || e.haber === ev.accountResultId));
    const cargos = db.charges.filter(c => c.sourceType === 'evento' && c.sourceId === id && !c.archived);
    const pend = cargos.reduce((s, c) => s + chargeRemaining(c), 0);
    let msg = '¿Eliminar "' + ev.name + '" definitivamente?\n\n';
    msg += cargos.length ? 'Se borran sus ' + cargos.length + ' cargo(s) a miembros' + (pend > 0 ? ' (deuda pendiente de ' + arsStr(pend) + ' que ya no se va a contar)' : '') + '.\n' : 'No tiene cargos a miembros.\n';
    msg += ents.length ? 'Tiene ' + ents.length + ' movimiento(s) en el libro diario: se anulan junto con sus comprobantes (quedan guardados como anulados, no se pierden) y dejan de sumar en saldos e informes.\n' : '';
    msg += '\nEsta acción no se puede deshacer.';
    if (!confirm(msg)) return;
    const entIds = new Set(ents.map(e => e.id));
    ents.forEach(e => { e.voided = true; });
    db.comprobantes.forEach(c => { if (entIds.has(c.entryId)) c.voided = true; });
    db.reintegros.forEach(r => {
        if (r.eventId === id) r.eventId = null;
        if (r.createdEntryId && entIds.has(r.createdEntryId)) r.voided = true;
    });
    db.charges = db.charges.filter(c => !(c.sourceType === 'evento' && c.sourceId === id));
    db.accounts = db.accounts.filter(a => a.id !== ev.accountResultId);
    db.events = db.events.filter(x => x.id !== id);
    logHist('eventos', 'Evento eliminado: ' + ev.name);
    closeModal();
    save();
    showToast('Evento eliminado.');
}

/* ---------------- Historial: se registra desde las funciones existentes ---------------- */
(function () {
    const wrap = (name, fn) => { const o = window[name]; if (typeof o !== 'function') return; window[name] = function () { return fn(o, this, arguments); }; };
    const tipoMov = e => {
        const d = db.accounts.find(a => a.id === e.debe), h = db.accounts.find(a => a.id === e.haber);
        if (h && h.type === 'ingreso') return 'Ingreso';
        if (d && d.type === 'gasto') return 'Gasto';
        return 'Movimiento';
    };
    wrap('postEntry', (o, t, a) => { const e = o.apply(t, a); logHist('dinero', tipoMov(e) + ': ' + e.desc + ' · ' + e.fecha, e.monto); return e; });
    wrap('makeComprobante', (o, t, a) => { const c = o.apply(t, a); logHist('papeles', 'Comprobante N.º ' + String(c.numero).padStart(4, '0') + ' — ' + receiptFullTitle(c), c.monto); return c; });
    const porCambio = (name, medida, texto, tipo) => wrap(name, (o, t, a) => {
        const antes = medida();
        const r = o.apply(t, a);
        if (medida() !== antes) logHist(tipo, texto(a));
        if (isActive('v-mas')) renderMas();
        return r;
    });
    const nVoid = () => db.entries.filter(e => e.voided).length + db.reintegros.filter(r => r.voided).length;
    porCambio('revertChargePaymentEntry', nVoid, () => 'Pago revertido (se anuló el asiento y el comprobante)', 'dinero');
    porCambio('toggleCuotaCell', nVoid, () => 'Pago de cuota marcado como no pagado', 'dinero');
    porCambio('voidReintegro', nVoid, () => 'Reintegro anulado', 'papeles');
    wrap('saveMember', (o, t, a) => {
        const nombre = (byId('f-name') || {}).value || '';
        const antes = db.members.length;
        const r = o.apply(t, a);
        if (db.members.length > antes) logHist('miembros', 'Miembro nuevo: ' + nombre.trim());
        else if (a[0]) logHist('miembros', 'Miembro editado: ' + nombre.trim());
        return r;
    });
    wrap('archiveMember', (o, t, a) => {
        const m = db.members.find(x => x.id === a[0]); const antes = m && m.archived;
        const r = o.apply(t, a);
        if (m && m.archived && !antes) logHist('miembros', 'Miembro archivado: ' + m.name);
        return r;
    });
    wrap('unarchiveMember', (o, t, a) => {
        const m = db.members.find(x => x.id === a[0]);
        const r = o.apply(t, a);
        if (m) logHist('miembros', 'Miembro restaurado: ' + m.name);
        return r;
    });
    wrap('createEvent', (o, t, a) => { const ev = o.apply(t, a); logHist('eventos', 'Evento creado: ' + (a[0] && a[0].name)); return ev; });
    wrap('archiveEvent', (o, t, a) => { const ev = db.events.find(x => x.id === a[0]); const antes = ev && ev.archived; const r = o.apply(t, a); if (ev && ev.archived && !antes) logHist('eventos', 'Evento finalizado: ' + ev.name); return r; });
    wrap('unarchiveEvent', (o, t, a) => { const ev = db.events.find(x => x.id === a[0]); const r = o.apply(t, a); if (ev) logHist('eventos', 'Evento reactivado: ' + ev.name); return r; });
    wrap('saveManualEntry', (o, t, a) => {
        const antes = a[0] ? JSON.stringify(db.entries.find(x => x.id === a[0])) : null;
        const r = o.apply(t, a);
        Promise.resolve(r).then(() => { if (a[0]) { const e = db.entries.find(x => x.id === a[0]); if (e && JSON.stringify(e) !== antes) logHist('dinero', 'Asiento editado: ' + e.desc, e.monto); } });
        return r;
    });
    wrap('generateReport', (o, t, a) => { const r = o.apply(t, a); if (a[0] && a[0].label) logHist('papeles', 'Informe generado: ' + a[0].label); return r; });
    wrap('exportBackup', (o, t, a) => { const r = o.apply(t, a); logHist('sistema', 'Respaldo descargado'); return r; });
})();


/* ---------------- Comprobante libre (desde cero) ---------------- */
function openLibreCompModal() {
    const mem = db.members.filter(m => !m.archived).sort((a, b) => a.name.localeCompare(b.name));
    const sug = ['Cuota mensual', 'Cuotas de varios meses', 'Cuota Brasil', 'Inscripción'].concat(db.events.filter(e => !e.archived).map(e => e.name))
        .concat(db.accounts.filter(a => a.type === 'ingreso' && !a.eventLinked).map(a => a.name));
    openModalHTML(`
        <h2>Nuevo comprobante</h2>
        <div class="field"><label>Recibí de</label>
            <select id="lc-mem" onchange="byId('lc-otro').style.display = this.value === '' ? '' : 'none'">
                ${mem.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('')}
                <option value="">Otra persona…</option></select>
            <input id="lc-otro" type="text" placeholder="Nombre y apellido" style="display:${mem.length ? 'none' : ''}; margin-top:8px"></div>
        <div class="field"><label>Título del comprobante</label><input id="lc-tit" type="text" value="Comprobante de pago"></div>
        <div class="field"><label>Concepto (escribilo o elegí uno)</label>
            <input id="lc-con" type="text" list="lc-sug" placeholder="Ej: Cuotas de agosto a octubre" autocomplete="off">
            <datalist id="lc-sug">${[...new Set(sug)].map(x => `<option value="${escapeHtml(x)}">`).join('')}</datalist></div>
        <div class="field"><label>Monto</label><input id="lc-monto" type="number" min="0" inputmode="decimal"></div>
        <div class="field"><label>Fecha</label><input id="lc-fecha" type="date" value="${todayISO()}"></div>
        <div class="field"><label>Asignar a una cuenta</label>
            <select id="lc-cuenta" onchange="byId('lc-medio-f').style.display = this.value === '' ? 'none' : ''">
                <option value="">No registrar en la contabilidad (solo comprobante)</option>${accountOptionsMov('ingreso')}</select></div>
        <div class="field" id="lc-medio-f" style="display:none"><label>Entró en</label>
            <select id="lc-medio"><option value="mp">Mercado Pago</option><option value="caja">Caja (efectivo)</option><option value="reservas">Reservas</option></select></div>
        <button class="btn btn-accent" onclick="saveLibreComp()">Generar comprobante</button>
        <button class="btn btn-outline mt" onclick="closeModal()">Cancelar</button>
    `);
}
function saveLibreComp() {
    const monto = parseFloat(byId('lc-monto').value);
    const concepto = byId('lc-con').value.trim();
    if (!concepto) { alert('Escribí o elegí un concepto.'); return; }
    if (!monto || monto <= 0) { alert('Ingresá un monto válido.'); return; }
    const memId = byId('lc-mem').value;
    const m = memId ? db.members.find(x => x.id === memId) : null;
    const nombre = m ? m.name : byId('lc-otro').value.trim();
    if (!nombre) { alert('Escribí el nombre de quien pagó.'); return; }
    const titulo = byId('lc-tit').value.trim() || 'Comprobante de pago';
    const fecha = isoToFecha(byId('lc-fecha').value || todayISO());
    const cuenta = byId('lc-cuenta').value;
    let entry = null;
    if (cuenta) entry = postEntry(concepto + ' — ' + nombre, byId('lc-medio').value, cuenta, monto, fecha);
    const comp = makeComprobante('libre', m ? m.id : null, concepto, monto, entry ? entry.id : null, { fecha, memberName: nombre, titulo });
    save();
    showToast('Comprobante generado.');
    openReceiptView(comp.id);
}
